plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.thierry.programme'
    compileSdk 35  // v7.1 — requis par connect-client 1.1.0-alpha12 (targetSdk reste 34)
    defaultConfig {
        applicationId "com.thierry.programme"
        minSdk 28
        targetSdk 34
        versionCode 56
        versionName "7.7"
    }
    // Clé de signature FIXE : chaque nouvel APK s'installe par-dessus le précédent
    // (sans désinstaller) → les données (courbe de poids) sont conservées.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release { minifyEnabled false }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // v7.0 — thème DayNight (jour/nuit automatique)
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.activity:activity:1.8.2'
    // v7.1 — alpha12 : SkinTemperatureRecord + API de disponibilité des fonctionnalités
    implementation 'androidx.health.connect:connect-client:1.1.0-alpha12'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    // v6.3 — OCR hors ligne des captures Xiaomi S400 (modèle latin intégré, ~4 Mo)
    implementation 'com.google.mlkit:text-recognition:16.0.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
