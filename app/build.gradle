plugins {
    id 'com.android.application'
}
android {
    namespace 'com.thierry.programme'
    compileSdk 34
    defaultConfig {
        applicationId "com.thierry.programme"
        minSdk 26
        targetSdk 34
        versionCode 26
        versionName "4.5"
    }
    // Clé de signature FIXE : chaque nouvel APK s'installe par-dessus le précédent
    // (sans désinstaller) → les données (courbe de poids) sont conservées.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
}
