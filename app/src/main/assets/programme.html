
<title>Callisthénie</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F8F9FA;color:#1a1a2e;overflow:hidden;overscroll-behavior:none}
:root{--bg:#F8F9FA;--white:#fff;--txt:#1a1a2e;--txt2:#555;--txt3:#999;--border:#eee;}
#app{display:flex;flex-direction:column;height:100vh;max-width:430px;margin:0 auto;background:var(--bg)}
#header{background:#fff;padding:20px 16px 14px;flex-shrink:0;border-bottom:1px solid var(--border)}
#header h1{font-size:22px;font-weight:800;color:var(--txt);letter-spacing:-.5px;line-height:1.1}
#header h1 span{color:#0055A4}
#header .header-sub{display:flex;align-items:center;gap:8px;margin-top:6px}
#header .h-dot{width:5px;height:5px;border-radius:50%;background:linear-gradient(135deg,#5C6BC0,#A29BFE)}
#header .h-tag{font-size:12px;font-weight:600;color:var(--txt3)}
#tabs{display:flex;background:#fff;overflow-x:auto;scrollbar-width:none;flex-shrink:0;border-bottom:2px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,.04)}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:0;padding:9px 4px;font-size:11px;font-weight:700;color:var(--txt3);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;text-align:center;transition:color .2s;white-space:nowrap}
.tab .tab-sub{display:block;font-size:9px;font-weight:500;margin-top:2px;color:var(--txt3)}
.tab.active .tab-sub{color:inherit}
#content{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;padding-bottom:env(safe-area-inset-bottom,0px)}
.session-header{padding:14px 16px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.session-badge{width:56px;height:56px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;line-height:1.1}
.session-badge .s-icon{font-size:20px}
.session-badge .s-lbl{font-size:8px;color:#fff;opacity:.9;text-transform:uppercase;letter-spacing:.3px;margin-top:2px;text-align:center;white-space:nowrap;width:100%;padding:0 4px}
.session-title{font-size:15px;font-weight:700;color:var(--txt);margin-bottom:3px}
.session-meta{font-size:11px;color:var(--txt2)}
.session-tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin-right:4px}
.progress-wrap{padding:10px 16px;background:#fff;border-bottom:1px solid var(--border)}
.progress-row{display:flex;justify-content:space-between;margin-bottom:6px}
.progress-lbl{font-size:12px;font-weight:600;color:var(--txt2)}
.progress-pct{font-size:13px;font-weight:700}
.progress-track{background:var(--border);border-radius:8px;height:7px;overflow:hidden}
.progress-fill{height:7px;border-radius:8px;transition:width .5s}
.round-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--border);flex-wrap:wrap}
.round-lbl{font-size:12px;font-weight:700;color:var(--txt2)}
.round-btn{width:36px;height:36px;border-radius:50%;border:2px solid;font-size:14px;font-weight:700;cursor:pointer;-webkit-appearance:none;transition:all .2s}
.round-rest-btn{margin-left:auto;border:none;color:#fff;font-size:12px;font-weight:700;padding:8px 12px;border-radius:20px;cursor:pointer;-webkit-appearance:none}
.warm-section{padding:12px 16px;background:#EEFAF7;border-bottom:1px solid #ddf2ec}
.warm-title{font-size:11px;font-weight:700;color:#4daa95;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.warm-item{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid rgba(127,205,187,.2)}
.warm-item:last-child{border:none}
.warm-item-txt{flex:1;font-size:13px;color:var(--txt);font-weight:500}
.warm-item-sub{font-size:11px;color:var(--txt3)}
.warm-badge{color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.bloc-titre{margin:8px 0 4px;padding:8px 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;border-radius:10px}
.exo-list{padding:12px 12px 24px}
.exo-card{background:#fff;border:1.5px solid var(--border);border-radius:16px;margin-bottom:10px;overflow:hidden;cursor:pointer;transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.exo-card.open{box-shadow:0 4px 18px rgba(0,0,0,.1)}
.exo-card.done{opacity:.55}
.exo-card-header{display:flex;align-items:center;padding:13px 14px;gap:12px}
.exo-num{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.exo-num.is-done{background:linear-gradient(135deg,#4ECDC4,#95E1D3)!important;color:#fff!important}
.exo-info{flex:1;min-width:0}
.exo-name{font-size:16px;font-weight:700;color:var(--txt);margin-bottom:3px}
.badge-row{display:flex;gap:5px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px}
.badge-kg{background:#fff8e0;color:#b8860b}
.exo-chevron{font-size:20px;color:var(--txt3);transition:transform .25s;line-height:1;flex-shrink:0}
.exo-card.open .exo-chevron{transform:rotate(180deg)}
.exo-detail{display:none;border-top:1px solid var(--border)}
.exo-card.open .exo-detail{display:block}
.exo-body{padding:13px 14px}
.steps-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.step{display:flex;gap:10px;margin-bottom:9px;align-items:flex-start}
.step-num{width:22px;height:22px;min-width:22px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.step-txt{font-size:15px;color:var(--txt2);line-height:1.55}
.tip-box{background:#fff8e0;border-radius:10px;padding:10px 12px;margin:8px 0 4px;font-size:14px;color:#8a7000;line-height:1.55;border-left:3px solid #ffd93d}
.err-box{background:#fff0f0;border-radius:10px;padding:10px 12px;margin:6px 0;font-size:14px;color:#c0392b;line-height:1.55;border-left:3px solid #FF6B6B}
.btn-row{display:flex;gap:8px;margin-top:12px}
.btn-row .btn-timer{margin-top:0;flex:1}
.btn-timer{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:none;font-size:14px;font-weight:700;padding:11px 10px;border-radius:12px;cursor:pointer;-webkit-appearance:none}
.btn-hold{background:linear-gradient(135deg,#7FCDBB,#4ECDC4);color:#fff}
.btn-rest{background:rgba(80,80,80,.08);color:#555;border:1.5px solid #e0d8e8}
.btn-done{display:flex;align-items:center;gap:8px;width:100%;background:#fff;border:1.5px solid var(--border);color:var(--txt2);font-size:13px;font-weight:600;padding:10px 16px;border-radius:12px;cursor:pointer;margin-top:8px;-webkit-appearance:none;justify-content:center}
.btn-done.is-done{border-color:#4ECDC4;color:#3db8b0;background:#f0fffe}
.conseil{margin:0 12px 80px;border-radius:16px;padding:13px 14px;font-size:14px;line-height:1.7;border:1px solid}
.conseil-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.repos-wrap{padding:16px}
.repos-card{background:#fff;border:1.5px solid var(--border);border-radius:16px;padding:18px;margin-bottom:12px;text-align:center}
.repos-icon{font-size:36px;margin-bottom:8px}
.repos-title{font-size:15px;font-weight:700;color:var(--txt);margin-bottom:6px}
.repos-txt{font-size:13px;color:var(--txt2);line-height:1.6}
#timer-overlay{display:none;position:fixed;inset:0;background:rgba(26,26,46,.93);z-index:100;align-items:center;justify-content:center;flex-direction:column;backdrop-filter:blur(4px)}
#timer-overlay.show{display:flex}
#timer-label{font-size:14px;font-weight:700;color:#ffd93d;margin-bottom:12px;text-align:center;padding:0 24px}
#timer-ring{position:relative;width:190px;height:190px;margin:8px 0}
#timer-ring svg{width:190px;height:190px;transform:rotate(-90deg)}
#timer-ring .ring-bg{fill:none;stroke:rgba(255,255,255,.1);stroke-width:10}
#timer-ring .ring-fg{fill:none;stroke:#5C6BC0;stroke-width:10;stroke-linecap:round;stroke-dasharray:534;stroke-dashoffset:0;transition:stroke-dashoffset .9s linear}
#timer-num{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:58px;font-weight:800;color:#fff;line-height:1}
#timer-sec{font-size:14px;color:rgba(255,255,255,.5);margin-bottom:24px;margin-top:4px}
#btn-stop{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.25);color:#fff;font-size:15px;font-weight:600;padding:13px 36px;border-radius:16px;cursor:pointer;-webkit-appearance:none}
.exo-card:active,.btn-timer:active,.btn-done:active,.round-btn:active,.tab:active,#btn-stop:active,button:active{transform:scale(.96)}
/* ===== Modernisation : jetons, thème sombre, animations ===== */
:root{
--ease:cubic-bezier(.22,1,.36,1);
--card:#fff;
--shadow:0 1px 2px rgba(16,24,40,.05),0 6px 20px rgba(16,24,40,.06);
--shadow-open:0 8px 30px rgba(16,24,40,.13);
--warm-bg:#EEFAF7;--warm-border:#ddf2ec;--warm-title:#4daa95;
--tip-bg:#fff8e0;--tip-txt:#8a7000;
--err-bg:#fff0f0;--err-txt:#c0392b;
--rest-bg:rgba(80,80,80,.08);--rest-txt:#555;--rest-border:#e0d8e8;
--done-bg:#f0fffe;
--conseil-bg:rgba(0,0,0,.028);
--roundbtn-bg:#fff;
--overlay:rgba(14,14,24,.88);
}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){
--bg:#0f0f17;--white:#191922;--txt:#f1f1f6;--txt2:#b4b4c4;--txt3:#77778a;--border:#272733;
--card:#191922;
--shadow:0 1px 2px rgba(0,0,0,.5),0 6px 20px rgba(0,0,0,.4);
--shadow-open:0 10px 34px rgba(0,0,0,.55);
--warm-bg:#12211e;--warm-border:#1d3a34;--warm-title:#5fc7ac;
--tip-bg:#2a2410;--tip-txt:#e9cb72;
--err-bg:#2c1719;--err-txt:#ff9d9d;
--rest-bg:rgba(255,255,255,.07);--rest-txt:#b4b4c4;--rest-border:#272733;
--done-bg:#102b29;
--conseil-bg:rgba(255,255,255,.05);
--roundbtn-bg:transparent;
--overlay:rgba(8,8,14,.92);
}
}
:root[data-theme="dark"]{
--bg:#0f0f17;--white:#191922;--txt:#f1f1f6;--txt2:#b4b4c4;--txt3:#77778a;--border:#272733;
--card:#191922;
--shadow:0 1px 2px rgba(0,0,0,.5),0 6px 20px rgba(0,0,0,.4);
--shadow-open:0 10px 34px rgba(0,0,0,.55);
--warm-bg:#12211e;--warm-border:#1d3a34;--warm-title:#5fc7ac;
--tip-bg:#2a2410;--tip-txt:#e9cb72;
--err-bg:#2c1719;--err-txt:#ff9d9d;
--rest-bg:rgba(255,255,255,.07);--rest-txt:#b4b4c4;--rest-border:#272733;
--done-bg:#102b29;
--conseil-bg:rgba(255,255,255,.05);
--roundbtn-bg:transparent;
--overlay:rgba(8,8,14,.92);
}
/* surfaces pilotées par les jetons */
html,body{background:var(--bg);color:var(--txt)}
#header,#tabs,.session-header,.progress-wrap,.round-bar,.exo-card,.btn-done,.repos-card{background:var(--card)}
.warm-section{background:var(--warm-bg);border-bottom-color:var(--warm-border)}
.warm-title{color:var(--warm-title)}
.tip-box{background:var(--tip-bg);color:var(--tip-txt)}
.err-box{background:var(--err-bg);color:var(--err-txt)}
.btn-rest{background:var(--rest-bg);color:var(--rest-txt);border-color:var(--rest-border)}
.btn-done.is-done{background:var(--done-bg)}
.conseil{background:var(--conseil-bg)!important}
.round-btn:not(.active){background:var(--roundbtn-bg)!important}
#timer-overlay{background:var(--overlay);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
/* finitions */
#content{scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
#header{position:relative;overflow:hidden}
#header:after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,#5C6BC0,#26A69A,#7E57C2,#EF5350,#F9A825);opacity:.8}
.tab{transition:color .25s var(--ease),border-color .25s var(--ease),background .25s}
.tab:focus-visible,.exo-card:focus-visible,button:focus-visible{outline:2px solid #5C6BC0;outline-offset:2px}
.exo-card{box-shadow:var(--shadow);transition:box-shadow .3s var(--ease),opacity .3s var(--ease),transform .16s var(--ease),border-color .3s}
.exo-card.open{box-shadow:var(--shadow-open)}
.exo-detail{display:block!important;max-height:0;opacity:0;overflow:hidden;border-top:0;transition:max-height .22s var(--ease),opacity .18s ease}
.exo-card.open .exo-detail{max-height:900px;opacity:1;border-top:1px solid var(--border);transition:max-height .4s var(--ease),opacity .3s ease}
.exo-chevron{transition:transform .3s var(--ease)}
.progress-fill{transition:width .8s var(--ease)}
.progress-track{height:8px}
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.exo-list .exo-card,.session-header,.progress-wrap,.warm-section,.round-bar,.bloc-titre,.conseil,.repos-wrap{animation:cardIn .4s var(--ease) both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes ringIn{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
#timer-overlay.show{animation:fadeIn .3s var(--ease)}
#timer-ring{animation:ringIn .45s var(--ease)}
#timer-num{transition:transform .16s var(--ease),color .3s}
#timer-num.tick{transform:translate(-50%,-50%) scale(1.09)}
#timer-overlay.urgent #timer-num{color:#FF7A7A}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.6);opacity:0}55%{transform:translate(-50%,-50%) scale(1.06);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
#celebrate{position:fixed;left:50%;top:50%;z-index:120;background:var(--card);border-radius:24px;padding:26px 32px;text-align:center;box-shadow:0 20px 70px rgba(0,0,0,.3);animation:pop .5s var(--ease);pointer-events:none;transition:opacity .4s}
#celebrate .ce-ico{font-size:48px;line-height:1}
#celebrate .ce-txt{font-weight:800;font-size:16px;margin-top:10px;color:var(--txt)}
@media (prefers-reduced-motion:reduce){
*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
/* ===== Semaine + séance guidée ===== */
#week-strip{display:flex;align-items:center;gap:10px;margin-top:10px}
.wk-lbl{font-size:11px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.wk-dots{display:flex;gap:5px;flex:1}
.wk-day{width:20px;height:20px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--txt3);background:var(--border);transition:all .3s var(--ease)}
.wk-day.is-rest{opacity:.45}
.wk-day.is-done{background:linear-gradient(135deg,#4ECDC4,#26A69A);color:#fff}
.wk-day.is-today{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px #5C6BC0}
.wk-count{font-size:11px;font-weight:700;color:var(--txt2);font-variant-numeric:tabular-nums}
.badge b{font-weight:800;opacity:.65;margin-left:2px}
#start-session{display:block;width:100%;margin-top:10px;border:none;-webkit-appearance:none;cursor:pointer;padding:12px;border-radius:12px;font-size:13px;font-weight:700;color:#fff;background:linear-gradient(135deg,#5C6BC0,#7E57C2);box-shadow:0 4px 14px rgba(92,107,192,.3)}
#guide-bar{position:fixed;left:0;right:0;bottom:0;z-index:90;display:flex;align-items:center;gap:12px;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--border);box-shadow:0 -6px 24px rgba(0,0,0,.14);max-width:430px;margin:0 auto;animation:barIn .32s var(--ease)}
@keyframes barIn{from{transform:translateY(100%)}to{transform:none}}
.gb-info{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px}
.gb-step{font-size:11px;font-weight:800;color:var(--txt3);font-variant-numeric:tabular-nums;flex-shrink:0}
.gb-name{font-size:13px;font-weight:700;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gb-actions{display:flex;gap:8px;flex-shrink:0}
.gb-quit{border:1.5px solid var(--border);background:transparent;color:var(--txt2);font-size:12px;font-weight:600;padding:9px 12px;border-radius:11px;cursor:pointer;-webkit-appearance:none}
.gb-go{border:none;background:linear-gradient(135deg,#4ECDC4,#26A69A);color:#fff;font-size:13px;font-weight:800;padding:10px 18px;border-radius:11px;cursor:pointer;-webkit-appearance:none;box-shadow:0 3px 12px rgba(38,166,154,.32)}
.exo-list{padding-bottom:96px}
</style>

var currentTab=0,doneExos={},timerInterval=null,timerTotal=0,timerLeft=0;
function todayKey(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function loadState(){
try{
var raw=localStorage.getItem('calli_state');
var st=raw?JSON.parse(raw):null;
doneExos=(st&&st.day===todayKey())?(st.doneExos||{}):{};
currentTab=(st&&typeof st.currentTab==='number')?st.currentTab:(new Date().getDay()+6)%7;
}catch(e){currentTab=(new Date().getDay()+6)%7;}
}
function saveState(){
try{localStorage.setItem('calli_state',JSON.stringify({day:todayKey(),doneExos:doneExos,currentTab:currentTab}));}catch(e){}
}
function buildTabs(){
var bar=document.getElementById('tabs');
bar.innerHTML='';
DAYS.forEach(function(d,i){
var el=document.createElement('div');
el.className='tab'+(i===currentTab?' active':'');
el.style.cssText='';
var C=COLORS[SESSIONS[SESSION_IDX[i]].col];
el.innerHTML=d.tab+'<span class="tab-sub">'+d.sub+'</span>';
el.onclick=(function(idx){return function(){showTab(idx);};})(i);
bar.appendChild(el);
});
updateTabColors(currentTab);
}

function updateTabColors(activeIdx){
document.querySelectorAll('.tab').forEach(function(t,i){
var C=COLORS[SESSIONS[SESSION_IDX[i]].col];
if(i===activeIdx){
t.style.color=C.bg;
t.style.borderBottomColor=C.bg;
} else {
t.style.color='';
t.style.borderBottomColor='transparent';
}
});
}

function showTab(i){
currentTab=i;
saveState();
document.querySelectorAll('.tab').forEach(function(t,j){t.classList.toggle('active',j===i);});
updateTabColors(i);
renderSession(SESSIONS[SESSION_IDX[i]]);
}

function makeCard(ex,i,s,dk,C){
var done=dk[i];
return '<div class="exo-card'+(done?' done':'')+'" id="card-'+s.id+'-'+i+'" onclick="toggleCard(\''+s.id+'\','+i+')">'
+'<div class="exo-card-header">'
+'<div class="exo-num'+(done?' is-done':'')+'" style="background:'+(done?'linear-gradient(135deg,#4ECDC4,#95E1D3)':C.light)+';color:'+(done?'#fff':C.badge)+'">'+(done?'&#x2713;':(i+1))+'</div>'
+'<div class="exo-info"><div class="exo-name">'+ex.name+'</div>'
+'<div class="badge-row">'

+(ex.hold>0?'<span class="badge" style="background:#f0fffe;color:#3db8b0">&#x23F1; '+ex.hold+'s</span>':'')
+(ex.note?'<span class="badge" style="background:#fff0eb;color:#e05500;font-weight:800">'+ex.note+'</span>':'')
+'</div></div>'
+'<span class="exo-chevron">&#x2304;</span></div>'
+'<div class="exo-detail"><div class="exo-body">'
+'<div class="steps-title" style="color:'+C.bg+'">&#x1F4CB; Technique</div>'
+ex.steps.map(function(st,n){return '<div class="step"><div class="step-num" style="background:'+C.bg+'">'+(n+1)+'</div><div class="step-txt">'+st+'</div></div>';}).join('')
+(ex.tip?'<div class="tip-box">'+ex.tip+'</div>':'')
+(ex.erreur?'<div class="err-box">'+ex.erreur+'</div>':'')
+'<div class="btn-row">'
+(ex.hold>0?'<button class="btn-timer btn-hold" onclick="event.stopPropagation();startTimer('+ex.hold+',\'&#x1F3CB; Exercice\')">&#x1F3CB; Exercice '+ex.hold+'s</button>':'')
+(ex.rest>0?'<button class="btn-timer btn-rest" onclick="event.stopPropagation();startTimer('+ex.rest+',\'&#x23F1; Repos\')">&#x23F1; Repos '+ex.rest+'s</button>':'')
+'</div>'
+'<button class="btn-done'+(done?' is-done':'')+'" onclick="event.stopPropagation();markDone(\''+s.id+'\','+i+')">'+(done?'&#x21A9; Marquer non fait':'&#x2713; Exercice termin&#233;')+'</button>'
+'</div></div></div>';
}

function renderSession(s){
var C=COLORS[s.col];
var dk=doneExos[s.id]||{};
var allExos=s.blocs?s.blocs.reduce(function(a,b){return a.concat(b.exos);},[]):s.exos;
var doneCount=Object.keys(dk).filter(function(k){return k.indexOf('__')<0;}).length;
var total=allExos.length;
var pct=total?Math.round(doneCount/total*100):0;
var html='';

html+='<div class="session-header">'
+'<div class="session-badge" style="background:'+C.grad+'">'
+(s.repos?'<span class="s-icon">'+s.letter+'</span>':'<span class="s-icon">'+s.letter+'</span>')
+'<span class="s-lbl">'+s.day+'</span>'
+'</div>'
+'<div><div class="session-title">'+s.name+'</div>'
+'<div class="session-meta"><span class="session-tag" style="background:'+C.light+';color:'+C.badge+'">'+(s.time||s.day)+'</span>'+s.desc+'</div>'
+'</div></div>';

if(!s.repos){
html+='<div class="progress-wrap">'
+'<div class="progress-row"><span class="progress-lbl">Progression</span><span class="progress-pct" style="color:'+C.bg+'">'+pct+'%</span></div>'
+'<div class="progress-track"><div class="progress-fill" style="background:'+C.grad+';width:'+pct+'%"></div></div>'
+'</div>';
}

if(s.warmup&&s.warmup.length>0){
html+='<div class="warm-section"><div class="warm-title">&#x1F525; Echauffement</div>';
s.warmup.forEach(function(w){
html+='<div class="warm-item"><div class="warm-item-txt">'+w.n+'<br><span class="warm-item-sub">'+w.d+'</span></div>'
+'<span class="warm-badge" style="background:'+C.bg+'">'+w.b+'</span></div>';
});
html+='</div>';
}

if(s.repos){
html+='<div class="repos-wrap"><div class="repos-card" style="border-color:'+C.bg+'33">'
+'<div class="repos-icon">🌿</div>'
+'<div class="repos-title">Journee de recuperation</div>'
+'<div class="repos-txt">Marche douce + etirements. Le muscle se reconstruit au repos.</div>'
+'</div></div>';
}

if(s.blocs&&s.blocs.length>0){
html+='<div class="exo-list">';
s.blocs.forEach(function(bloc,b){
html+='<div class="bloc-titre" style="background:'+C.light+';color:'+C.badge+'">'+bloc.titre+'</div>';
if(bloc.type==='rounds'){
var curRound=doneExos['__round_'+s.id]||1;
html+='<div class="round-bar">'
+'<span class="round-lbl">Tour</span>'
+[1,2,3].map(function(r){
return '<button class="round-btn'+(curRound===r?' active':'')+'" '
+'style="'+(curRound===r?'background:'+C.bg+';color:#fff;border-color:'+C.bg:'background:#fff;color:'+C.badge+';border-color:'+C.badge)+'" '
+'onclick="setRound(\''+s.id+'\','+r+')">'+r+'</button>';
}).join('')
+'<button class="round-rest-btn" style="background:'+C.grad+'" onclick="startTimer(90,\'&#x23F1; Repos entre les tours\')">&#x23F1; Repos 90s</button>'
+'</div>';
}
var offset=b*100;
bloc.exos.forEach(function(ex,i){html+=makeCard(ex,offset+i,s,dk,C);});
});
html+='</div>';
} else {
if(!s.repos){
var curRound=doneExos['__round_'+s.id]||1;
html+='<div class="round-bar">'
+'<span class="round-lbl">Tour</span>'
+[1,2,3].map(function(r){
return '<button class="round-btn'+(curRound===r?' active':'')+'" '
+'style="'+(curRound===r?'background:'+C.bg+';color:#fff;border-color:'+C.bg:'background:#fff;color:'+C.badge+';border-color:'+C.badge)+'" '
+'onclick="setRound(\''+s.id+'\','+r+')">'+r+'</button>';
}).join('')
+'<button class="round-rest-btn" style="background:'+C.grad+'" onclick="startTimer(90,\'&#x23F1; Repos entre les tours\')">&#x23F1; Repos 90s</button>'
+'</div>';
}
html+='<div class="exo-list">';
s.exos.forEach(function(ex,i){html+=makeCard(ex,i,s,dk,C);});
html+='</div>';
}

html+='<div class="conseil" style="background:'+C.light+';border-color:'+C.bg+'33">'
+'<div class="conseil-title" style="color:'+C.bg+'">&#x1F4A1; Conseil</div>'+s.conseil+'</div>';

document.getElementById('content').innerHTML=html;
document.getElementById('content').scrollTop=0;
}

doneExos['__round_'+sid]=r;
saveState();
renderSession(SESSIONS[SESSION_IDX[currentTab]]);
}

function toggleCard(sid,i){
var card=document.getElementById('card-'+sid+'-'+i);
var isOpen=card.classList.contains('open');
document.querySelectorAll('.exo-card.open').forEach(function(c){c.classList.remove('open');});

function markDone(sid,i){
if(!doneExos[sid])doneExos[sid]={};
if(doneExos[sid][i])delete doneExos[sid][i];
else doneExos[sid][i]=true;
saveState();
if(window.AndroidBridge&&AndroidBridge.haptic)AndroidBridge.haptic();
var sc=document.getElementById('content').scrollTop;
renderSession(SESSIONS[SESSION_IDX[currentTab]]);
document.getElementById('content').scrollTop=sc;
var card=document.getElementById('card-'+sid+'-'+i);
if(card)card.classList.add('open');
}

var wakeLock=null;
async function requestWakeLock(){try{if('wakeLock' in navigator){wakeLock=await navigator.wakeLock.request('screen');}}catch(e){}}
function releaseWakeLock(){try{if(wakeLock){wakeLock.release();wakeLock=null;}}catch(e){}}

function startTimer(sec,label){
timerTotal=sec;timerLeft=sec;
document.getElementById('timer-label').textContent=label||'Repos';
document.getElementById('timer-overlay').classList.add('show');
updateTimer();
requestWakeLock();
clearInterval(timerInterval);
timerInterval=setInterval(function(){
timerLeft--;updateTimer();
if(timerLeft<=0){clearInterval(timerInterval);releaseWakeLock();setTimeout(stopTimer,900);}
},1000);
}
function updateTimer(){
document.getElementById('timer-num').textContent=timerLeft;
var fg=document.getElementById('ring-fg');
fg.style.strokeDashoffset=534*(1-timerLeft/timerTotal);
fg.style.stroke=timerLeft<=5?'#EF5350':timerLeft<=10?'#F9A825':'#5C6BC0';
}
function stopTimer(){
clearInterval(timerInterval);
releaseWakeLock();
document.getElementById('timer-overlay').classList.remove('show');
}

loadState();
buildTabs();
renderSession(SESSIONS[SESSION_IDX[currentTab]]);
window.handleBack=function(){
var openCard=document.querySelector('.exo-card.open');
if(openCard){openCard.classList.remove('open');return true;}
var timerOverlay=document.getElementById('timer-overlay');
if(timerOverlay&&timerOverlay.classList.contains('show')){stopTimer();return true;}
return false;
};
/* ===== Son, retour haptique, animations, swipe ===== */
var audioCtx=null,beepIv=null;
function initAudio(){try{if(!audioCtx){var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx=new AC();}if(audioCtx.state==='suspended'){audioCtx.resume();}}catch(e){}}
function beep(freq,dur,vol){
try{
initAudio();
if(!audioCtx)return;
var t=audioCtx.currentTime;
var o=audioCtx.createOscillator(),g=audioCtx.createGain();
o.type='sine';o.frequency.value=freq;
g.gain.setValueAtTime(0.0001,t);
g.gain.exponentialRampToValueAtTime(vol,t+0.012);
g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
o.connect(g);g.connect(audioCtx.destination);
o.start(t);o.stop(t+dur+0.03);
}catch(e){}
}
function buzz(){try{if(window.AndroidBridge&&AndroidBridge.haptic)AndroidBridge.haptic();else if(navigator.vibrate)navigator.vibrate(12);}catch(e){}}

var _startTimer=startTimer;
startTimer=function(sec,label){
initAudio();
_startTimer(sec,label);
var num=document.getElementById('timer-num');
var ov=document.getElementById('timer-overlay');
clearInterval(beepIv);
beepIv=setInterval(function(){
if(timerLeft>0){
beep(880,0.05,0.05);
if(num){num.classList.add('tick');setTimeout(function(){num.classList.remove('tick');},150);}
if(ov)ov.classList.toggle('urgent',timerLeft<=5);
}else{
beep(1320,0.3,0.09);buzz();clearInterval(beepIv);
if(ov)ov.classList.remove('urgent');
}
},1000);
};

var _stopTimer=stopTimer;
stopTimer=function(){
clearInterval(beepIv);
var ov=document.getElementById('timer-overlay');
if(ov)ov.classList.remove('urgent');
_stopTimer();
};

var _showTab=showTab;
showTab=function(i){buzz();_showTab(i);};

var _setRound=setRound;
setRound=function(sid,r){buzz();_setRound(sid,r);};

var _toggleCard=toggleCard;
toggleCard=function(sid,i){
buzz();
_toggleCard(sid,i);
var c=document.getElementById('card-'+sid+'-'+i);
if(c&&c.classList.contains('open')){setTimeout(function(){c.scrollIntoView({behavior:'smooth',block:'nearest'});},260);}
};

var _renderSession=renderSession;
renderSession=function(s){
_renderSession(s);
var cards=document.querySelectorAll('#content .exo-card');
for(var i=0;i<cards.length;i++){cards[i].style.animationDelay=(Math.min(i,10)*35)+'ms';}
};

function doneCountOf(sid){var dk=doneExos[sid]||{};return Object.keys(dk).filter(function(k){return k.indexOf('__')<0;}).length;}
function totalExosOf(s){return (s.blocs?s.blocs.reduce(function(a,b){return a.concat(b.exos);},[]):s.exos).length;}

var _markDone=markDone;
markDone=function(sid,i){
var before=doneCountOf(sid);
_markDone(sid,i);
var after=doneCountOf(sid);
var s=SESSIONS[SESSION_IDX[currentTab]];
if(after>before&&after===totalExosOf(s)&&after>0)celebrate();
};

function celebrate(){
buzz();
beep(880,0.12,0.07);
setTimeout(function(){beep(1174,0.12,0.07);},130);
setTimeout(function(){beep(1568,0.3,0.08);},260);
var old=document.getElementById('celebrate');
if(old&&old.parentNode)old.parentNode.removeChild(old);
var d=document.createElement('div');
d.id='celebrate';
d.innerHTML='<div class="ce-ico">&#127942;</div><div class="ce-txt">S&eacute;ance termin&eacute;e !</div>';
document.body.appendChild(d);
setTimeout(function(){d.style.opacity='0';setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d);},450);},1600);
}

/* Balayage horizontal pour changer de jour */
(function(){
var x0=null,y0=null,t0=0;
var el=document.getElementById('content');
if(!el)return;
el.addEventListener('touchstart',function(e){var t=e.touches[0];x0=t.clientX;y0=t.clientY;t0=Date.now();},{passive:true});
el.addEventListener('touchend',function(e){
if(x0===null)return;
var t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
x0=null;
if(Date.now()-t0>700)return;
if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.8)return;
var n=currentTab+(dx<0?1:-1);
if(n<0||n>DAYS.length-1)return;
showTab(n);
var tabs=document.querySelectorAll('.tab');
if(tabs[n]&&tabs[n].scrollIntoView)tabs[n].scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
},{passive:true});
})();

/* Re-rendu initial pour bénéficier des animations d'entrée */
renderSession(SESSIONS[SESSION_IDX[currentTab]]);

/* ===== Suivi hebdomadaire + mode séance guidée ===== */

/* ---------- Suivi hebdomadaire ---------- */
function histLoad(){try{return JSON.parse(localStorage.getItem('calli_hist')||'{}');}catch(e){return {};}}
function histSave(h){try{localStorage.setItem('calli_hist',JSON.stringify(h));}catch(e){}}
function dayKey(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function startOfWeek(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());var k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x;}
function weekNumber(){
var h=histLoad();
if(!h.__start){h.__start=dayKey(startOfWeek(new Date()));histSave(h);}
var p=h.__start.split('-');
var s=new Date(+p[0],+p[1]-1,+p[2]);
var diff=startOfWeek(new Date())-s;
return Math.max(1,Math.floor(diff/604800000)+1);
}
function markSessionDone(sid){
var h=histLoad();
h[dayKey(new Date())]=sid;
histSave(h);
renderWeekStrip();
}
function renderWeekStrip(){
var host=document.getElementById('week-strip');
if(!host)return;
var h=histLoad(),sow=startOfWeek(new Date()),today=dayKey(new Date());
var labels=['L','M','M','J','V','S','D'],dots='',count=0;
for(var i=0;i<7;i++){
var d=new Date(sow.getFullYear(),sow.getMonth(),sow.getDate()+i);
var k=dayKey(d),done=!!h[k],isToday=(k===today),rest=(i===6);
if(done)count++;
dots+='<span class="wk-day'+(done?' is-done':'')+(isToday?' is-today':'')+(rest?' is-rest':'')+'">'+labels[i]+'</span>';
}
host.innerHTML='<span class="wk-lbl">Semaine '+weekNumber()+'</span><span class="wk-dots">'+dots+'</span><span class="wk-count">'+count+'/6</span>';
}
(function(){
var hdr=document.getElementById('header');
if(!hdr)return;
var s=document.createElement('div');
s.id='week-strip';
hdr.appendChild(s);
renderWeekStrip();
})();

/* ---------- Objectifs de tenue progressifs ---------- */
function holdTarget(base,tip){
if(!base)return base;
if(!tip||!/chaque semaine|Objectif/i.test(tip))return base;
var cap=base+25;
var m=tip.match(/(\d+)\s*sec/i);
if(m)cap=Math.max(base,parseInt(m[1],10));
return Math.min(base+5*(weekNumber()-1),cap);
}
function applyHoldTargets(s){
var all=s.blocs?s.blocs.reduce(function(a,b){return a.concat(b.exos);},[]):s.exos;
var cards=document.querySelectorAll('#content .exo-card');
var flat=[];
if(s.blocs){s.blocs.forEach(function(b){b.exos.forEach(function(e){flat.push(e);});});}else{flat=all;}
for(var i=0;i<cards.length&&i<flat.length;i++){
var ex=flat[i];
if(!ex.hold)continue;
var t=holdTarget(ex.hold,ex.tip);
if(t===ex.hold)continue;
var badge=cards[i].querySelector('.badge-row .badge:last-child');
if(badge&&/\d+s$/.test(badge.textContent))badge.innerHTML='&#x23F1; '+t+'s <b>S'+weekNumber()+'</b>';
var btn=cards[i].querySelector('.btn-hold');
if(btn){
btn.textContent='🏋 Exercice '+t+'s';
btn.onclick=(function(sec){return function(e){e.stopPropagation();startTimer(sec,'🏋 Exercice');};})(t);
}
}
}

/* ---------- Fin de minuteur : rappel ---------- */
var timerDoneCb=null;
function runTimer(sec,label,cb){timerDoneCb=cb;startTimer(sec,label);}
var _startTimer2=startTimer;
startTimer=function(sec,label){
_startTimer2(sec,label);
clearInterval(window.__endWatch);
window.__endWatch=setInterval(function(){
if(timerLeft<=0){
clearInterval(window.__endWatch);
var cb=timerDoneCb;timerDoneCb=null;
if(cb)setTimeout(cb,1000);
}
},250);
};
var _stopTimer2=stopTimer;
stopTimer=function(){clearInterval(window.__endWatch);timerDoneCb=null;_stopTimer2();};

/* ---------- Mode séance guidée ---------- */
var guided=null;
function guidedExos(s){return s.blocs?s.blocs.reduce(function(a,b){return a.concat(b.exos);},[]):s.exos;}
function guidedIds(s){
var ids=[];
if(s.blocs){s.blocs.forEach(function(b,bi){b.exos.forEach(function(e,i){ids.push(bi*100+i);});});}
else{s.exos.forEach(function(e,i){ids.push(i);});}
return ids;
}
function startGuided(){
var s=SESSIONS[SESSION_IDX[currentTab]];
if(s.repos)return;
guided={sid:s.id,i:0,held:false};
buzz();
renderBar();
focusGuided();
}
function stopGuided(){guided=null;renderBar();}
function focusGuided(){
var s=SESSIONS[SESSION_IDX[currentTab]];
var ids=guidedIds(s);
var id=ids[guided.i];
document.querySelectorAll('.exo-card.open').forEach(function(c){c.classList.remove('open');});
var card=document.getElementById('card-'+s.id+'-'+id);
if(card){card.classList.add('open');setTimeout(function(){card.scrollIntoView({behavior:'smooth',block:'center'});},120);}
}
function guidedNext(){
var s=SESSIONS[SESSION_IDX[currentTab]];
var ids=guidedIds(s);
if(guided.i>=ids.length-1){stopGuided();return;}
guided.i++;guided.held=false;
renderBar();
focusGuided();
}
function guidedAction(){
var s=SESSIONS[SESSION_IDX[currentTab]];
var exos=guidedExos(s),ids=guidedIds(s);
var ex=exos[guided.i],id=ids[guided.i];
var target=holdTarget(ex.hold,ex.tip);
if(ex.hold>0&&!guided.held){
guided.held=true;renderBar();
runTimer(target,'🏋 '+ex.name,function(){guidedAfterExo();});
return;
}
guidedAfterExo();
}
function guidedAfterExo(){
var s=SESSIONS[SESSION_IDX[currentTab]];
var exos=guidedExos(s),ids=guidedIds(s);
var ex=exos[guided.i],id=ids[guided.i];
var dk=doneExos[s.id]||{};
if(!dk[id])markDone(s.id,id);
if(!guided)return;
var last=(guided.i>=ids.length-1);
if(last){stopGuided();return;}
if(ex.rest>0){
var nxt=exos[guided.i+1];
runTimer(ex.rest,'⏱ Repos · puis '+nxt.name,function(){guidedNext();});
}else{
guidedNext();
}
}
function renderBar(){
var bar=document.getElementById('guide-bar');
if(!guided){if(bar&&bar.parentNode)bar.parentNode.removeChild(bar);return;}
var s=SESSIONS[SESSION_IDX[currentTab]];
var exos=guidedExos(s),ex=exos[guided.i];
var target=holdTarget(ex.hold,ex.tip);
var label=(ex.hold>0&&!guided.held)?('Démarrer '+target+' s'):'Terminé';
if(!bar){
bar=document.createElement('div');
bar.id='guide-bar';
document.body.appendChild(bar);
}
bar.innerHTML='<div class="gb-info"><span class="gb-step">'+(guided.i+1)+'/'+exos.length+'</span><span class="gb-name"></span></div>'
+'<div class="gb-actions"><button class="gb-quit" type="button">Arrêter</button><button class="gb-go" type="button"></button></div>';
bar.querySelector('.gb-name').textContent=ex.name;
bar.querySelector('.gb-go').textContent=label;
bar.querySelector('.gb-go').onclick=function(){buzz();guidedAction();};
bar.querySelector('.gb-quit').onclick=function(){buzz();stopGuided();};
}

/* bouton Démarrer la séance, injecté après chaque rendu */
var _renderSession2=renderSession;
renderSession=function(s){
_renderSession2(s);
applyHoldTargets(s);
if(!s.repos){
var pw=document.querySelector('#content .progress-wrap');
if(pw&&!document.getElementById('start-session')){
var b=document.createElement('button');
b.id='start-session';
b.type='button';
b.textContent='▶ Démarrer la séance';
b.onclick=function(){startGuided();};
pw.appendChild(b);
}
}
if(guided&&guided.sid!==s.id)stopGuided();
renderBar();
};

var _showTab2=showTab;
showTab=function(i){if(guided)stopGuided();_showTab2(i);};

var _celebrate=celebrate;
celebrate=function(){
_celebrate();
markSessionDone(SESSIONS[SESSION_IDX[currentTab]].id);
if(guided)stopGuided();
};

var _handleBack=window.handleBack;
window.handleBack=function(){
if(guided){stopGuided();return true;}
return _handleBack();
};

renderSession(SESSIONS[SESSION_IDX[currentTab]]);
</script>
