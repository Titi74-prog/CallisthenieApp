<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1a2e">
<title>Callisthénie — Thierry</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F8F9FA;color:#1a1a2e;overflow:hidden;overscroll-behavior:none}
:root{--bg:#F8F9FA;--white:#fff;--txt:#1a1a2e;--txt2:#555;--txt3:#999;--border:#eee;}
#app{display:flex;flex-direction:column;height:100vh;max-width:430px;margin:0 auto;background:var(--bg)}
#header{background:#fff;padding:20px 16px 14px;flex-shrink:0;border-bottom:1px solid var(--border)}
#header h1{font-size:22px;font-weight:800;color:var(--txt);letter-spacing:-.5px;line-height:1.1}
#header h1 span{color:#0055A4}
#header .header-sub{display:flex;align-items:center;gap:8px;margin-top:6px}
#header .h-dot{width:5px;height:5px;border-radius:50%;background:linear-gradient(135deg,#5C6BC0,#A29BFE)}
#header .h-tag{font-size:12px;font-weight:600;color:var(--txt3)}
#tabs{display:flex;background:#fff;overflow-x:auto;scrollbar-width:none;flex-shrink:0;border-bottom:2px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,.04)}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:0;padding:9px 4px;font-size:11px;font-weight:700;color:var(--txt3);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;text-align:center;transition:color .2s;white-space:nowrap}
.tab .tab-sub{display:block;font-size:9px;font-weight:500;margin-top:2px;color:var(--txt3)}
.tab.active .tab-sub{color:inherit}
#content{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;padding-bottom:env(safe-area-inset-bottom,0px)}
.session-header{padding:14px 16px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.session-badge{width:56px;height:56px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;line-height:1.1}
.session-badge .s-icon{font-size:20px}
.session-badge .s-lbl{font-size:8px;color:#fff;opacity:.9;text-transform:uppercase;letter-spacing:.3px;margin-top:2px;text-align:center;white-space:nowrap;width:100%;padding:0 4px}
.session-title{font-size:15px;font-weight:700;color:var(--txt);margin-bottom:3px}
.session-meta{font-size:11px;color:var(--txt2)}
.session-tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin-right:4px}
.progress-wrap{padding:10px 16px;background:#fff;border-bottom:1px solid var(--border)}
.progress-row{display:flex;justify-content:space-between;margin-bottom:6px}
.progress-lbl{font-size:12px;font-weight:600;color:var(--txt2)}
.progress-pct{font-size:13px;font-weight:700}
.progress-track{background:var(--border);border-radius:8px;height:7px;overflow:hidden}
.progress-fill{height:7px;border-radius:8px;transition:width .5s}
.round-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--border);flex-wrap:wrap}
.round-lbl{font-size:12px;font-weight:700;color:var(--txt2)}
.round-btn{width:36px;height:36px;border-radius:50%;border:2px solid;font-size:14px;font-weight:700;cursor:pointer;-webkit-appearance:none;transition:all .2s}
.round-rest-btn{margin-left:auto;border:none;color:#fff;font-size:12px;font-weight:700;padding:8px 12px;border-radius:20px;cursor:pointer;-webkit-appearance:none}
.warm-section{padding:12px 16px;background:#EEFAF7;border-bottom:1px solid #ddf2ec}
.warm-title{font-size:11px;font-weight:700;color:#4daa95;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.warm-item{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid rgba(127,205,187,.2)}
.warm-item:last-child{border:none}
.warm-item-txt{flex:1;font-size:13px;color:var(--txt);font-weight:500}
.warm-item-sub{font-size:11px;color:var(--txt3)}
.warm-badge{color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.bloc-titre{margin:8px 0 4px;padding:8px 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;border-radius:10px}
.exo-list{padding:12px 12px 24px}
.exo-card{background:#fff;border:1.5px solid var(--border);border-radius:16px;margin-bottom:10px;overflow:hidden;cursor:pointer;transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.exo-card.open{box-shadow:0 4px 18px rgba(0,0,0,.1)}
.exo-card.done{opacity:.55}
.exo-card-header{display:flex;align-items:center;padding:13px 14px;gap:12px}
.exo-num{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.exo-num.is-done{background:linear-gradient(135deg,#4ECDC4,#95E1D3)!important;color:#fff!important}
.exo-info{flex:1;min-width:0}
.exo-name{font-size:14px;font-weight:700;color:var(--txt);margin-bottom:3px}
.badge-row{display:flex;gap:5px;flex-wrap:wrap}
.badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px}
.badge-kg{background:#fff8e0;color:#b8860b}
.exo-chevron{font-size:20px;color:var(--txt3);transition:transform .25s;line-height:1;flex-shrink:0}
.exo-card.open .exo-chevron{transform:rotate(180deg)}
.exo-detail{display:none;border-top:1px solid var(--border)}
.exo-card.open .exo-detail{display:block}
.exo-body{padding:13px 14px}
.steps-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.step{display:flex;gap:10px;margin-bottom:9px;align-items:flex-start}
.step-num{width:22px;height:22px;min-width:22px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.step-txt{font-size:13px;color:var(--txt2);line-height:1.55}
.tip-box{background:#fff8e0;border-radius:10px;padding:10px 12px;margin:8px 0 4px;font-size:12px;color:#8a7000;line-height:1.55;border-left:3px solid #ffd93d}
.err-box{background:#fff0f0;border-radius:10px;padding:10px 12px;margin:6px 0;font-size:12px;color:#c0392b;line-height:1.55;border-left:3px solid #FF6B6B}
.btn-row{display:flex;gap:8px;margin-top:12px}
.btn-row .btn-timer{margin-top:0;flex:1}
.btn-timer{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:none;font-size:13px;font-weight:700;padding:11px 10px;border-radius:12px;cursor:pointer;-webkit-appearance:none}
.btn-hold{background:linear-gradient(135deg,#7FCDBB,#4ECDC4);color:#fff}
.btn-rest{background:rgba(80,80,80,.08);color:#555;border:1.5px solid #e0d8e8}
.btn-done{display:flex;align-items:center;gap:8px;width:100%;background:#fff;border:1.5px solid var(--border);color:var(--txt2);font-size:13px;font-weight:600;padding:10px 16px;border-radius:12px;cursor:pointer;margin-top:8px;-webkit-appearance:none;justify-content:center}
.btn-done.is-done{border-color:#4ECDC4;color:#3db8b0;background:#f0fffe}
.conseil{margin:0 12px 80px;border-radius:16px;padding:13px 14px;font-size:12px;line-height:1.7;border:1px solid}
.conseil-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.repos-wrap{padding:16px}
.repos-card{background:#fff;border:1.5px solid var(--border);border-radius:16px;padding:18px;margin-bottom:12px;text-align:center}
.repos-icon{font-size:36px;margin-bottom:8px}
.repos-title{font-size:15px;font-weight:700;color:var(--txt);margin-bottom:6px}
.repos-txt{font-size:13px;color:var(--txt2);line-height:1.6}
#timer-overlay{display:none;position:fixed;inset:0;background:rgba(26,26,46,.93);z-index:100;align-items:center;justify-content:center;flex-direction:column;backdrop-filter:blur(4px)}
#timer-overlay.show{display:flex}
#timer-label{font-size:14px;font-weight:700;color:#ffd93d;margin-bottom:12px;text-align:center;padding:0 24px}
#timer-ring{position:relative;width:190px;height:190px;margin:8px 0}
#timer-ring svg{width:190px;height:190px;transform:rotate(-90deg)}
#timer-ring .ring-bg{fill:none;stroke:rgba(255,255,255,.1);stroke-width:10}
#timer-ring .ring-fg{fill:none;stroke:#5C6BC0;stroke-width:10;stroke-linecap:round;stroke-dasharray:534;stroke-dashoffset:0;transition:stroke-dashoffset .9s linear}
#timer-num{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:58px;font-weight:800;color:#fff;line-height:1}
#timer-sec{font-size:14px;color:rgba(255,255,255,.5);margin-bottom:24px;margin-top:4px}
#btn-stop{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.25);color:#fff;font-size:15px;font-weight:600;padding:13px 36px;border-radius:16px;cursor:pointer;-webkit-appearance:none}
  .exo-card:active,.btn-timer:active,.btn-done:active,.round-btn:active,.tab:active,#btn-stop:active,button:active{transform:scale(.96)}
</style>
</head>
<body>
<div id="app">
<div id="header">
  <h1>Callisthénie · <span>Thierry</span></h1>
  <div class="header-sub">
    <div class="h-dot"></div>
    <span class="h-tag">6 séances / semaine</span>
  </div>
</div>
<div id="tabs"></div>
<div id="content"></div>
</div>
<div id="timer-overlay">
  <div id="timer-label">Repos</div>
  <div id="timer-ring">
    <svg viewBox="0 0 190 190"><circle class="ring-bg" cx="95" cy="95" r="85"/><circle class="ring-fg" id="ring-fg" cx="95" cy="95" r="85"/></svg>
    <div id="timer-num">0</div>
  </div>
  <div id="timer-sec">secondes</div>
  <button id="btn-stop" onclick="stopTimer()">Arreter</button>
</div>
<script>
var COLORS={
  A:{bg:'#5C6BC0',light:'#eef0fb',badge:'#5C6BC0',grad:'linear-gradient(135deg,#5C6BC0,#7986CB)'},
  B:{bg:'#26A69A',light:'#e8f6f5',badge:'#26A69A',grad:'linear-gradient(135deg,#26A69A,#4DB6AC)'},
  C:{bg:'#7E57C2',light:'#f3f0fb',badge:'#7E57C2',grad:'linear-gradient(135deg,#7E57C2,#9575CD)'},
  D:{bg:'#EF5350',light:'#fef0f0',badge:'#EF5350',grad:'linear-gradient(135deg,#EF5350,#E57373)'},
  E:{bg:'#F9A825',light:'#fffbec',badge:'#F57F17',grad:'linear-gradient(135deg,#FDD835,#F9A825)'},
  REC:{bg:'#66BB6A',light:'#edf7ee',badge:'#43A047',grad:'linear-gradient(135deg,#66BB6A,#81C784)'},
};

var DAYS=[
  {tab:'Lun',sub:'Séance A'},
  {tab:'Mar',sub:'Séance B'},
  {tab:'Mer',sub:'Séance C'},
  {tab:'Jeu',sub:'Séance D'},
  {tab:'Ven',sub:'Séance C'},
  {tab:'Sam',sub:'Séance E'},
  {tab:'Dim',sub:'Repos'},
];

var SESSION_IDX=[0,1,2,3,4,5,6];

var SESSIONS=[
/* ─── A — LUNDI : Dos & Gainage avec haltères ─── */
{id:'A',letter:'A',col:'A',day:'Lun',time:'7h15',
 name:'Dos & Gainage',desc:'Chaîne postérieure + haltères',
 conseil:'Les haltères de 3 kg transforment des exercices simples en vrais exercices de définition. Tempo lent, contraction consciente à chaque rep.',
 warmup:[
  {n:'Rotations cervicales et épaules',d:'Lent, amplitude max',b:'2x10'},
  {n:'Cat-Cow',d:'Synchronisé avec la respiration',b:'2x8'},
  {n:'Rotations bras complets',d:'Avant puis arrière',b:'2x10'},
 ],
 exos:[
  {name:'Rowing haltères — penché',reps:'12 rép.',rest:60,hold:0,kg:'3 kg',
   steps:['Penché en avant à 45°, dos plat et rigide, haltères en main bras tendus.','Tirer les coudes vers l\'arrière en serrant les omoplates — expirer.','Tenir 1 sec en haut, descendre lentement sur 3 sec.','12 répétitions, concentration sur la contraction du dos.'],
   tip:'💡 C\'est l\'exercice qui dessine le dos le plus efficacement. Priorité à la qualité.',
   erreur:'⚠ Ne pas arrondir le dos — il reste plat et rigide tout au long.'},
  {name:'Superman haltères',reps:'10 rép.',rest:45,hold:0,kg:'1,5 kg',
   steps:['Allongé ventre, haltères de 1,5 kg dans les mains, bras tendus devant.','Lever simultanément bras et jambes en expirant.','Tenir 3 secondes en haut — contraction maximale.','Redescente lente sans toucher le sol.'],
   tip:'💡 Le 1,5 kg suffit — ce n\'est pas la charge qui compte mais la durée de contraction.',
   erreur:'⚠ Membres tendus — ne pas plier les coudes.'},
  {name:'Planche frontale — tenue progressive',reps:'35 sec',rest:45,hold:35,kg:'',
   steps:['Avant-bras au sol, coudes sous les épaules.','Corps aligné tête-talon, nombril rentré.','Fessiers contractés, respiration lente.','Augmenter de 5 sec chaque semaine.'],
   tip:'💡 Objectif : 60 sec en 5 semaines. Notez votre temps.',
   erreur:'⚠ Si le dos s\'affaisse : posez les genoux.'},
  {name:'Bird-Dog — pause longue',reps:'8 rép./côté',rest:45,hold:0,kg:'',
   steps:['À 4 pattes, dos plat comme une table.','Tendre bras droit + jambe gauche à l\'horizontale.','Tenir 4 secondes — contraction abdos et fessiers.','Revenir lentement et alterner.'],
   tip:'💡 4 secondes de tension = gainage profond bien plus intense.',
   erreur:'⚠ Le bassin ne pivote pas — hanches parallèles au sol.'},
  {name:'Curl biceps haltères — tempo lent',reps:'12 rép.',rest:60,hold:0,kg:'3 kg',
   steps:['Debout, haltères de 3 kg dans chaque main, paumes vers le haut.','Fléchir les coudes lentement sur 2 secondes.','Tenir 1 sec en haut, descendre sur 3 secondes.','Les coudes restent collés au corps — ne pas les écarter.'],
   tip:'💡 La descente lente (3 sec) est ce qui dessine les biceps.',
   erreur:'⚠ Ne pas balancer le buste pour prendre de l\'élan — mouvement strict.'},
  {name:'Planche latérale — tenue',reps:'25 sec/côté',rest:30,hold:25,kg:'',
   steps:['Sur le côté, appui sur l\'avant-bras.','Lever les hanches — corps aligné tête-pied.','Tenir 25 secondes sans laisser les hanches descendre.','Alterner les côtés.'],
   tip:'💡 Progresser vers 40 sec en 6 semaines.',
   erreur:'⚠ Hanches qui s\'affaissent = obliques qui ne travaillent plus.'},
 ]},

/* ─── B — MARDI : Abdos & Lombaires ─── */
{id:'B',letter:'B',col:'B',day:'Mar',time:'7h15',
 name:'Abdos & Lombaires',desc:'Sangle abdominale profonde',
 conseil:'Tempo lent sur chaque exercice — c\'est la clé de la définition abdominale. Pas de reps rapides.',
 warmup:[
  {n:'Rotations buste debout',d:'Hanches fixes',b:'2x10'},
  {n:'Cat-Cow',d:'Lent, respirez',b:'2x8'},
  {n:'Rotations bras complets',d:'Activation épaules',b:'2x10'},
 ],
 exos:[
  {name:'Relevés de jambes allongé — tempo lent',reps:'12 rép.',rest:60,hold:0,kg:'',
   steps:['Allongé sur le dos, mains sous les fesses.','Jambes tendues à la verticale au départ.','Descendre les jambes en 4 secondes vers 30° du sol.','Remonter en expirant — dos plaqué en permanence.'],
   tip:'💡 Plus les jambes descendent bas, plus c\'est difficile. Le dos plaqué est la priorité.',
   erreur:'⚠ Le dos ne se cambre jamais — mains sous les fesses si besoin.'},
  {name:'Crunchs — tempo 3 secondes',reps:'15 rép.',rest:45,hold:0,kg:'',
   steps:['Allongé, genoux à 90°, mains derrière les oreilles.','Montée lente sur 2 secondes — seules les épaules décollent.','Pause 1 seconde en haut, contraction maximale.','Descente sur 3 secondes — tête ne touche pas le sol.'],
   tip:'💡 Le tempo lent triple l\'efficacité par rapport aux reps rapides.',
   erreur:'⚠ Ne tirez pas sur la nuque — coudes ouverts.'},
  {name:'Dead Bug — tempo 4 secondes',reps:'8 rép./côté',rest:45,hold:0,kg:'',
   steps:['Allongé, DOS PLAQUÉ au sol — règle absolue.','Bras au plafond, genoux à 90°.','Descendre bras droit + jambe gauche sur 4 secondes.','Si le dos décolle : réduire l\'amplitude.'],
   tip:'💡 Meilleur exercice pour la stabilité lombaire. Peut être fait quotidiennement.',
   erreur:'⚠ Le dos NE DOIT PAS décoller du sol.'},
  {name:'Pont fessier — tenue isométrique',reps:'40 sec',rest:45,hold:40,kg:'',
   steps:['Allongé, genoux à 90°, pieds à plat.','Monter les hanches en contractant les fessiers.','Maintenir la position haute 40 secondes.','Respiration lente et régulière pendant la tenue.'],
   tip:'💡 La tenue isométrique est plus efficace que les répétitions pour tonifier les fessiers.',
   erreur:'⚠ Le mouvement vient des fessiers, pas du bas du dos.'},
  {name:'Vacuum abdominal',reps:'20 sec',rest:30,hold:20,kg:'',
   steps:['Debout, assis ou à 4 pattes.','Expirer à fond — vider complètement les poumons.','Rentrer le nombril vers la colonne au maximum.','Tenir 20 sec, respiration courte et superficielle.'],
   tip:'💡 L\'exercice ventre plat n°1. À refaire aussi debout dans la journée.',
   erreur:'⚠ C\'est une rétraction vers l\'intérieur, pas une contraction vers le haut.'},
  {name:'Extension dorsale au sol (Cobra actif)',reps:'12 rép.',rest:45,hold:0,kg:'',
   steps:['Allongé ventre, bras le long du corps paumes vers le bas.','Décoller le buste en contractant les lombaires — bras collés au corps.','Tenir 2 secondes en haut.','Redescendre lentement sur 3 secondes.'],
   tip:'💡 Sans les mains = travail lombaire pur. Plus dur qu\'il n\'y paraît.',
   erreur:'⚠ Ne pas pousser avec les mains — bras collés au corps.'},
 ]},

/* ─── C — MERCREDI & VENDREDI : Circuit métabolique ─── */
{id:'C',letter:'C',col:'C',day:'Mer',time:'7h15',
 name:'Circuit Métabolique',desc:'Cardio + force — 3 tours',
 conseil:'3 tours complets, 90 sec de repos entre chaque tour. Rythme régulier du premier au dernier — pas de sprint au départ.',
 warmup:[
  {n:'Rotations épaules + buste',d:'Amplitude progressive',b:'2x10'},
  {n:'Cat-Cow',d:'Activez la colonne',b:'2x8'},
  {n:'Rotations bras complets',d:'Accélérez progressivement',b:'2x10'},
 ],
 exos:[
  {name:'Montées de bras énergiques',reps:'2 min',rest:15,hold:120,kg:'1,5 kg',
   steps:['Debout, haltères de 1,5 kg, légère flexion des hanches.','Lever alternativement les bras au-dessus de la tête à rythme soutenu.','Bras actifs, épaules engagées — rythme continu.','2 minutes, respiration régulière.'],
   tip:'💡 Le 1,5 kg suffit pour activer les épaules et monter le cardio.',
   erreur:'⚠ Ne bloquez pas la respiration — rythme respiratoire régulier.'},
  {name:'Rowing assis haltères',reps:'45 sec',rest:15,hold:45,kg:'3 kg',
   steps:['Assis sur le tapis, jambes tendues, haltères de 3 kg.','Se pencher légèrement en avant, bras tendus.','Tirer les deux bras vers les hanches en se redressant.','Rythme soutenu — cardio + dos.'],
   tip:'💡 Contractez le dos à chaque traction.',
   erreur:'⚠ Gardez un galbe naturel — ne vous affaissez pas.'},
  {name:'Planche dynamique in-out',reps:'30 sec',rest:15,hold:30,kg:'',
   steps:['Position planche bras tendus.','Avancer les deux mains vers les pieds en fléchissant les hanches.','Revenir en position planche en un mouvement fluide.','1 aller-retour toutes les 2-3 secondes.'],
   tip:'💡 Gainage + cardio sans impact.',
   erreur:'⚠ Ne relâchez pas le gainage lors du retour.'},
  {name:'Pompes inclinées (mains sur chaise)',reps:'10 rép.',rest:15,hold:0,kg:'',
   steps:['Mains sur le bord de l\'assise, corps aligné.','Descendre coudes à 45°, poitrine qui touche l\'assise.','Pousser en expirant, corps gaîné.','Chaque semaine : baisser la hauteur d\'appui.'],
   tip:'💡 Plus les mains sont basses, plus c\'est difficile. Progression vers le sol.',
   erreur:'⚠ Corps comme une planche — hanches ne montent pas.'},
  {name:'Planche frontale',reps:'30 sec',rest:15,hold:30,kg:'',
   steps:['Avant-bras au sol, corps aligné.','Nombril rentré, fessiers contractés.','Respirez lentement.','Genoux au sol si la forme se dégrade.'],
   tip:'💡 20 sec en bonne forme vaut mieux que 30 sec en mauvaise.',
   erreur:'⚠ Ne retenez pas votre respiration.'},
  {name:'Pont fessier',reps:'20 rép.',rest:90,hold:0,kg:'',
   steps:['Allongé, pieds à plat, largeur bassin.','Pousser à travers les talons — lever les hanches.','Contracter les fessiers — tenir 2 sec en haut.','Descendre lentement. Puis 90 sec de repos.'],
   tip:'💡 Fin de tour — 90 sec de repos puis recommencer.',
   erreur:'⚠ Mouvement des fessiers, pas du dos.'},
 ]},

/* ─── D — JEUDI : Haut du corps haltères ─── */
{id:'D',letter:'D',col:'D',day:'Jeu',time:'7h15',
 name:'Haut du Corps',desc:'Épaules, bras, poitrine — haltères',
 conseil:'Tempo lent sur tous les exercices haltères. La descente sur 3 sec est ce qui dessine la musculature. Notez vos pompes négatives — c\'est votre baromètre.',
 warmup:[
  {n:'Rotations épaules + poignets',d:'Amplitude complète',b:'2x10'},
  {n:'Cat-Cow',d:'Mobilité colonne',b:'2x8'},
  {n:'Rotations bras complets',d:'Avant puis arrière',b:'2x10'},
 ],
 exos:[
  {name:'Développé épaules haltères',reps:'12 rép.',rest:60,hold:0,kg:'3 kg',

var currentTab=0,doneExos={},timerInterval=null,timerTotal=0,timerLeft=0;
function todayKey(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function loadState(){
    try{
      var raw=localStorage.getItem('calli_state');
      var st=raw?JSON.parse(raw):null;
      doneExos=(st&&st.day===todayKey())?(st.doneExos||{}):{};
      currentTab=(st&&typeof st.currentTab==='number')?st.currentTab:(new Date().getDay()+6)%7;
    }catch(e){currentTab=(new Date().getDay()+6)%7;}
  }
  function saveState(){
    try{localStorage.setItem('calli_state',JSON.stringify({day:todayKey(),doneExos:doneExos,currentTab:currentTab}));}catch(e){}
  }
function buildTabs(){
  var bar=document.getElementById('tabs');
  bar.innerHTML='';
  DAYS.forEach(function(d,i){
    var el=document.createElement('div');
    el.className='tab'+(i===currentTab?' active':'');
    el.style.cssText='';
    var C=COLORS[SESSIONS[SESSION_IDX[i]].col];
    el.innerHTML=d.tab+'<span class="tab-sub">'+d.sub+'</span>';
    el.onclick=(function(idx){return function(){showTab(idx);};})(i);
    bar.appendChild(el);
  });
    updateTabColors(currentTab);

function updateTabColors(activeIdx){
  document.querySelectorAll('.tab').forEach(function(t,i){
    var C=COLORS[SESSIONS[SESSION_IDX[i]].col];
    if(i===activeIdx){
      t.style.color=C.bg;
      t.style.borderBottomColor=C.bg;
    } else {
      t.style.color='';
      t.style.borderBottomColor='transparent';
    }
  });
}

function showTab(i){
  currentTab=i;
  saveState();
  document.querySelectorAll('.tab').forEach(function(t,j){t.classList.toggle('active',j===i);});
  updateTabColors(i);
  renderSession(SESSIONS[SESSION_IDX[i]]);
}

function makeCard(ex,i,s,dk,C){
  var done=dk[i];
  return '<div class="exo-card'+(done?' done':'')+'" id="card-'+s.id+'-'+i+'" onclick="toggleCard(\''+s.id+'\','+i+')">'
    +'<div class="exo-card-header">'
    +'<div class="exo-num'+(done?' is-done':'')+'" style="background:'+(done?'linear-gradient(135deg,#4ECDC4,#95E1D3)':C.light)+';color:'+(done?'#fff':C.badge)+'">'+(done?'&#x2713;':(i+1))+'</div>'
    +'<div class="exo-info"><div class="exo-name">'+ex.name+'</div>'
    +'<div class="badge-row">'
    +'<span class="badge" style="background:'+C.light+';color:'+C.badge+'">'+ex.reps+'</span>'
    +(ex.kg?'<span class="badge badge-kg">&#x1F3CB; '+ex.kg+'</span>':'')
    +(ex.hold>0?'<span class="badge" style="background:#f0fffe;color:#3db8b0">&#x23F1; '+ex.hold+'s</span>':'')
    +'</div></div>'
    +'<span class="exo-chevron">&#x2304;</span></div>'
    +'<div class="exo-detail"><div class="exo-body">'
    +'<div class="steps-title" style="color:'+C.bg+'">&#x1F4CB; Technique</div>'
    +ex.steps.map(function(st,n){return '<div class="step"><div class="step-num" style="background:'+C.bg+'">'+(n+1)+'</div><div class="step-txt">'+st+'</div></div>';}).join('')
    +(ex.tip?'<div class="tip-box">'+ex.tip+'</div>':'')
    +(ex.erreur?'<div class="err-box">'+ex.erreur+'</div>':'')
    +'<div class="btn-row">'
    +(ex.hold>0?'<button class="btn-timer btn-hold" onclick="event.stopPropagation();startTimer('+ex.hold+',\'&#x1F3CB; Exercice\')">&#x1F3CB; Exercice '+ex.hold+'s</button>':'')
    +(ex.rest>0?'<button class="btn-timer btn-rest" onclick="event.stopPropagation();startTimer('+ex.rest+',\'&#x23F1; Repos\')">&#x23F1; Repos '+ex.rest+'s</button>':'')
    +'</div>'
    +'<button class="btn-done'+(done?' is-done':'')+'" onclick="event.stopPropagation();markDone(\''+s.id+'\','+i+')">'+(done?'&#x21A9; Marquer non fait':'&#x2713; Exercice termin&#233;')+'</button>'
    +'</div></div></div>';
}

function renderSession(s){
  var C=COLORS[s.col];
  var dk=doneExos[s.id]||{};
  var allExos=s.blocs?s.blocs.reduce(function(a,b){return a.concat(b.exos);},[]):s.exos;
  var doneCount=Object.keys(dk).filter(function(k){return k.indexOf('__')<0;}).length;
  var total=allExos.length;
  var pct=total?Math.round(doneCount/total*100):0;
  var html='';

  html+='<div class="session-header">'
    +'<div class="session-badge" style="background:'+C.grad+'">'
    +(s.repos?'<span class="s-icon">'+s.letter+'</span>':'<span class="s-icon">'+s.letter+'</span>')
    +'<span class="s-lbl">'+s.day+'</span>'
    +'</div>'
    +'<div><div class="session-title">'+s.name+'</div>'
    +'<div class="session-meta"><span class="session-tag" style="background:'+C.light+';color:'+C.badge+'">'+(s.time||s.day)+'</span>'+s.desc+'</div>'
    +'</div></div>';

  if(!s.repos){
    html+='<div class="progress-wrap">'
      +'<div class="progress-row"><span class="progress-lbl">Progression</span><span class="progress-pct" style="color:'+C.bg+'">'+pct+'%</span></div>'
      +'<div class="progress-track"><div class="progress-fill" style="background:'+C.grad+';width:'+pct+'%"></div></div>'
      +'</div>';
  }

  if(s.warmup&&s.warmup.length>0){
    html+='<div class="warm-section"><div class="warm-title">&#x1F525; Echauffement</div>';
    s.warmup.forEach(function(w){
      html+='<div class="warm-item"><div class="warm-item-txt">'+w.n+'<br><span class="warm-item-sub">'+w.d+'</span></div>'
        +'<span class="warm-badge" style="background:'+C.bg+'">'+w.b+'</span></div>';
    });
    html+='</div>';
  }

  if(s.repos){
    html+='<div class="repos-wrap"><div class="repos-card" style="border-color:'+C.bg+'33">'
      +'<div class="repos-icon">🌿</div>'
      +'<div class="repos-title">Journee de recuperation</div>'
      +'<div class="repos-txt">Marche douce + etirements. Le muscle se reconstruit au repos.</div>'
      +'</div></div>';
  }

  if(s.blocs&&s.blocs.length>0){
    html+='<div class="exo-list">';
    s.blocs.forEach(function(bloc,b){
      html+='<div class="bloc-titre" style="background:'+C.light+';color:'+C.badge+'">'+bloc.titre+'</div>';
      if(bloc.type==='rounds'){
        var curRound=doneExos['__round_'+s.id]||1;
        html+='<div class="round-bar">'
          +'<span class="round-lbl">Tour</span>'
          +[1,2,3].map(function(r){
            return '<button class="round-btn'+(curRound===r?' active':'')+'" '
              +'style="'+(curRound===r?'background:'+C.bg+';color:#fff;border-color:'+C.bg:'background:#fff;color:'+C.badge+';border-color:'+C.badge)+'" '
              +'onclick="setRound(\''+s.id+'\','+r+')">'+r+'</button>';
          }).join('')
          +'<button class="round-rest-btn" style="background:'+C.grad+'" onclick="startTimer(90,\'&#x23F1; Repos entre les tours\')">&#x23F1; Repos 90s</button>'
          +'</div>';
      }
      var offset=b*100;
      bloc.exos.forEach(function(ex,i){html+=makeCard(ex,offset+i,s,dk,C);});
    });
    html+='</div>';
  } else {
    if(!s.repos){
      var curRound=doneExos['__round_'+s.id]||1;
      html+='<div class="round-bar">'
        +'<span class="round-lbl">Tour</span>'
        +[1,2,3].map(function(r){
          return '<button class="round-btn'+(curRound===r?' active':'')+'" '
            +'style="'+(curRound===r?'background:'+C.bg+';color:#fff;border-color:'+C.bg:'background:#fff;color:'+C.badge+';border-color:'+C.badge)+'" '
            +'onclick="setRound(\''+s.id+'\','+r+')">'+r+'</button>';
        }).join('')
        +'<button class="round-rest-btn" style="background:'+C.grad+'" onclick="startTimer(90,\'&#x23F1; Repos entre les tours\')">&#x23F1; Repos 90s</button>'
        +'</div>';
    }
    html+='<div class="exo-list">';
    s.exos.forEach(function(ex,i){html+=makeCard(ex,i,s,dk,C);});
    html+='</div>';
  }

  html+='<div class="conseil" style="background:'+C.light+';border-color:'+C.bg+'33">'
    +'<div class="conseil-title" style="color:'+C.bg+'">&#x1F4A1; Conseil</div>'+s.conseil+'</div>';

  document.getElementById('content').innerHTML=html;
  document.getElementById('content').scrollTop=0;
}

function setRound(sid,r){
  doneExos['__round_'+sid]=r;
  saveState();
  renderSession(SESSIONS[SESSION_IDX[currentTab]]);
}

function toggleCard(sid,i){
  var card=document.getElementById('card-'+sid+'-'+i);
  var isOpen=card.classList.contains('open');
  document.querySelectorAll('.exo-card.open').forEach(function(c){c.classList.remove('open');});
  if(!isOpen)card.classList.add('open');
}

function markDone(sid,i){
  if(!doneExos[sid])doneExos[sid]={};
  if(doneExos[sid][i])delete doneExos[sid][i];
  else doneExos[sid][i]=true;
  saveState();
  if(window.AndroidBridge&&AndroidBridge.haptic)AndroidBridge.haptic();
  var sc=document.getElementById('content').scrollTop;
  renderSession(SESSIONS[SESSION_IDX[currentTab]]);
  document.getElementById('content').scrollTop=sc;
  var card=document.getElementById('card-'+sid+'-'+i);
  if(card)card.classList.add('open');
}

var wakeLock=null;
async function requestWakeLock(){try{if('wakeLock' in navigator){wakeLock=await navigator.wakeLock.request('screen');}}catch(e){}}
function releaseWakeLock(){try{if(wakeLock){wakeLock.release();wakeLock=null;}}catch(e){}}

function startTimer(sec,label){
  timerTotal=sec;timerLeft=sec;
  document.getElementById('timer-label').textContent=label||'Repos';
  document.getElementById('timer-overlay').classList.add('show');
  updateTimer();
  requestWakeLock();
  clearInterval(timerInterval);
  timerInterval=setInterval(function(){
    timerLeft--;updateTimer();
    if(timerLeft<=0){clearInterval(timerInterval);releaseWakeLock();setTimeout(stopTimer,900);}
  },1000);
}
function updateTimer(){
  document.getElementById('timer-num').textContent=timerLeft;
  var fg=document.getElementById('ring-fg');
  fg.style.strokeDashoffset=534*(1-timerLeft/timerTotal);
  fg.style.stroke=timerLeft<=5?'#EF5350':timerLeft<=10?'#F9A825':'#5C6BC0';
}
function stopTimer(){
  clearInterval(timerInterval);
  releaseWakeLock();
  document.getElementById('timer-overlay').classList.remove('show');
}

loadState();
  buildTabs();
  renderSession(SESSIONS[SESSION_IDX[currentTab]]);
  window.handleBack=function(){
    var openCard=document.querySelector('.exo-card.open');
    if(openCard){openCard.classList.remove('open');return true;}
    var timerOverlay=document.getElementById('timer-overlay');
    if(timerOverlay&&timerOverlay.classList.contains('show')){stopTimer();return true;}
    return false;
  };
</script>
