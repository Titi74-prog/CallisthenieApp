<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<title>Poids — Thierry</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f0f13;color:#f0efec;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh;max-width:430px;margin:0 auto}
#header{background:#1a1a22;padding:16px;border-bottom:1px solid #2a2a35;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
#header h1{font-size:18px;font-weight:800;color:#f0efec;letter-spacing:-.3px}
#header h1 span{color:#0055A4}
#header-time{font-size:16px;font-weight:700;color:#6b6a75;font-variant-numeric:tabular-nums}
#date-bar{background:#1a1a22;border-bottom:1px solid #2a2a35;padding:8px 10px;display:flex;gap:6px;align-items:center;flex-shrink:0}
.date-nav-btn{width:32px;height:32px;border-radius:8px;border:1px solid #2a2a35;background:transparent;color:#b0aeb8;font-size:15px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.date-nav-btn:disabled{opacity:.3}
#date-label{flex:1;text-align:center;font-size:13px;font-weight:700;color:#f0efec;cursor:pointer;padding:6px 4px;border-radius:8px}
#date-label .date-sub{display:block;font-size:10px;font-weight:500;color:#6b6a75;margin-top:1px}
#content{flex:1;overflow-y:auto;padding:12px;padding-bottom:24px}
#totaux{display:flex;gap:8px;margin-bottom:12px}
.tot-card{flex:1;background:#1a1a22;border:1px solid #2a2a35;border-radius:10px;padding:10px;text-align:center}
.tot-label{font-size:10px;color:#6b6a75;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.tot-val{font-size:18px;font-weight:700}
.tot-sub{font-size:10px;color:#6b6a75;margin-top:2px}
.entry-card{background:#1a1a22;border:1px solid #2a2a35;border-radius:14px;padding:14px;margin-bottom:12px}
.entry-row{display:flex;gap:8px;align-items:center}
.entry-row label{font-size:13px;color:#b0aeb8;white-space:nowrap}
#inp-poids{flex:1;font-size:20px;font-weight:700;padding:10px 12px;border-radius:10px;border:1px solid #2a2a35;background:#0f0f13;color:#f0efec;text-align:center}
#btn-save-poids{margin-top:10px;width:100%;padding:12px;border-radius:12px;border:none;background:linear-gradient(135deg,#5C6BC0,#7986CB);color:#fff;font-size:14px;font-weight:700;cursor:pointer}
#btn-del-poids{margin-top:8px;width:100%;padding:9px;border-radius:12px;border:1px solid #2a2a35;background:transparent;color:#EF5350;font-size:12px;cursor:pointer;display:none}
.chart-card{background:#1a1a22;border:1px solid #2a2a35;border-radius:14px;padding:12px;margin-bottom:12px}
.chart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.chart-title{font-size:11px;font-weight:700;color:#6b6a75;text-transform:uppercase;letter-spacing:.6px}
.period-toggle{display:flex;gap:4px}
.period-btn{padding:5px 9px;border-radius:7px;border:1px solid #2a2a35;background:transparent;color:#b0aeb8;font-size:11px;font-weight:700;cursor:pointer}
.period-btn.active{background:#1a1a35;border-color:#5C6BC0;color:#7986CB}
#chart-empty{text-align:center;color:#6b6a75;padding:30px 10px;font-size:13px}
#chart-canvas{width:100%;display:block}
.section-title{font-size:11px;font-weight:700;color:#6b6a75;text-transform:uppercase;letter-spacing:.8px;margin:16px 0 8px}
.hist-row{display:flex;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid #2a2a35;font-size:13px;background:#1a1a22}
.hist-row:first-child{border-radius:10px 10px 0 0}
.hist-row:last-child{border-bottom:none;border-radius:0 0 10px 10px}
.hist-date{flex:1;color:#f0efec;font-weight:600}
.hist-kg{color:#f0efec;font-weight:700}
.hist-delta{min-width:46px;text-align:right;font-size:11px}
#hist-list{border:1px solid #2a2a35;border-radius:10px;overflow:hidden}
</style>
</head>
<body>
<div id="app">
<div id="header">
  <h1>Poids · <span>Thierry</span></h1>
  <div id="header-time"></div>
</div>
<div id="date-bar">
  <button class="date-nav-btn" id="btn-prev-day" onclick="changeDay(-1)">‹</button>
  <div id="date-label" onclick="goToday()"></div>
  <button class="date-nav-btn" id="btn-next-day" onclick="changeDay(1)">›</button>
</div>
<div id="content">
  <div id="totaux">
    <div class="tot-card">
      <div class="tot-label">Actuel</div>
      <div class="tot-val" id="tot-actuel">—</div>
      <div class="tot-sub">dernier relevé</div>
    </div>
    <div class="tot-card">
      <div class="tot-label">Objectif</div>
      <div class="tot-val" id="tot-objectif" style="color:#4ECDC4">87 kg</div>
      <div class="tot-sub" id="tot-ecart">—</div>
    </div>
    <div class="tot-card">
      <div class="tot-label">Évolution</div>
      <div class="tot-val" id="tot-evol">—</div>
      <div class="tot-sub" id="tot-evol-sub">depuis le début</div>
    </div>
  </div>

  <div class="entry-card">
    <div class="entry-row">
      <label for="inp-poids">Poids (kg)</label>
      <input type="number" id="inp-poids" step="0.1" min="30" max="250" placeholder="—">
    </div>
    <button id="btn-save-poids" onclick="savePoids()">Enregistrer</button>
    <button id="btn-del-poids" onclick="deletePoids()">Supprimer ce relevé</button>
  </div>

  <div class="chart-card">
    <div class="chart-header">
      <span class="chart-title">Courbe de poids</span>
      <div class="period-toggle">
        <button class="period-btn" id="btn-p-30" onclick="setChartPeriod(30)">30j</button>
        <button class="period-btn active" id="btn-p-90" onclick="setChartPeriod(90)">90j</button>
        <button class="period-btn" id="btn-p-all" onclick="setChartPeriod(0)">Tout</button>
      </div>
    </div>
    <div id="chart-empty">Ajoute des relevés pour voir ta courbe</div>
    <canvas id="chart-canvas" height="160"></canvas>
  </div>

  <div class="section-title">Historique récent</div>
  <div id="hist-list"></div>
  <div style="height:12px"></div>
</div>
</div>

<script>
var JOURS_LABEL = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
var MOIS_LABEL = ['jan','fév','mar','avr','mai','juin','juil','août','sep','oct','nov','déc'];
var OBJECTIF = 87;
var allData = {}; // { 'YYYY-MM-DD': kg (number) }
var currentDate = new Date();
currentDate.setHours(0,0,0,0);
var chartPeriod = 90;

function pad2(n){ return String(n).padStart(2,'0'); }
function dateKey(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function todayKey(){ var t=new Date(); t.setHours(0,0,0,0); return dateKey(t); }
function parseKey(k){ var p=k.split('-'); return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2])); }

// Historique reconstitué à partir de la courbe de suivi partagée par Thierry (points "Poids mesuré"),
// complété par la pesée du lundi 14/09 (90,2 kg) qu'il a communiquée directement.
// Ne sert qu'à amorcer le tout premier lancement : si des données existent déjà, on ne touche à rien.
var SEED_HISTORY = {
  '2026-06-22': 97.0,
  '2026-06-25': 93.8,
  '2026-06-29': 93.0,
  '2026-07-02': 92.3,
  '2026-07-07': 92.6,
  '2026-07-08': 92.4,
  '2026-07-10': 91.6,
  '2026-07-13': 90.9,
  '2026-07-19': 90.1,
  '2026-07-23': 89.8,
  '2026-08-02': 90.8,
  '2026-08-09': 91.4,
  '2026-08-12': 90.7,
  '2026-08-17': 90.6,
  '2026-08-23': 90.4,
  '2026-08-29': 89.5,
  '2026-09-02': 89.6,
  '2026-09-05': 89.7,
  '2026-09-08': 89.8,
  '2026-09-12': 89.9,
  '2026-09-14': 90.2
};

function loadAllData(){
  try{
    var saved = localStorage.getItem('poids_data');
    if(saved){
      allData = JSON.parse(saved);
    } else {
      allData = Object.assign({}, SEED_HISTORY);
      saveAllData();
    }
  }catch(e){}
}
function saveAllData(){
  try{ localStorage.setItem('poids_data', JSON.stringify(allData)); }catch(e){}
}

function sortedKeys(){
  return Object.keys(allData).sort();
}

function updateClock(){
  var now=new Date();
  var h=String(now.getHours()).padStart(2,'0');
  var m=String(now.getMinutes()).padStart(2,'0');
  document.getElementById('header-time').textContent=h+':'+m;
}
updateClock(); setInterval(updateClock,10000);

function updateDateLabel(){
  var key = dateKey(currentDate);
  var isToday = key===todayKey();
  var lbl = document.getElementById('date-label');
  var jourTxt = JOURS_LABEL[currentDate.getDay()]+' '+currentDate.getDate()+' '+MOIS_LABEL[currentDate.getMonth()];
  lbl.innerHTML = (isToday?'Aujourd\'hui':jourTxt) + (isToday?'<span class="date-sub">'+jourTxt+'</span>':'<span class="date-sub">Retour à aujourd\'hui</span>');
  document.getElementById('btn-next-day').disabled = isToday;
}

function changeDay(delta){
  currentDate.setDate(currentDate.getDate()+delta);
  var todayD = new Date(); todayD.setHours(0,0,0,0);
  if(currentDate.getTime() > todayD.getTime()){ currentDate = todayD; }
  loadCurrentDay();
}
function goToday(){
  var key = dateKey(currentDate);
  if(key===todayKey()) return;
  currentDate = new Date(); currentDate.setHours(0,0,0,0);
  loadCurrentDay();
}

function loadCurrentDay(){
  updateDateLabel();
  var key = dateKey(currentDate);
  var val = allData[key];
  var inp = document.getElementById('inp-poids');
  inp.value = (val!==undefined && val!==null) ? val : '';
  document.getElementById('btn-del-poids').style.display = (val!==undefined && val!==null) ? 'block' : 'none';
  renderStats();
  renderChart();
  renderHistory();
}

function savePoids(){
  var inp = document.getElementById('inp-poids');
  var v = parseFloat((inp.value||'').replace(',','.'));
  if(isNaN(v) || v<=0){ inp.focus(); return; }
  v = Math.round(v*10)/10;
  var key = dateKey(currentDate);
  allData[key] = v;
  saveAllData();
  document.getElementById('btn-del-poids').style.display='block';
  renderStats();
  renderChart();
  renderHistory();
}

function deletePoids(){
  var key = dateKey(currentDate);
  delete allData[key];
  saveAllData();
  document.getElementById('inp-poids').value='';
  document.getElementById('btn-del-poids').style.display='none';
  renderStats();
  renderChart();
  renderHistory();
}

function renderStats(){
  var keys = sortedKeys();
  var actEl=document.getElementById('tot-actuel');
  var ecartEl=document.getElementById('tot-ecart');
  var evolEl=document.getElementById('tot-evol');
  var evolSubEl=document.getElementById('tot-evol-sub');
  document.getElementById('tot-objectif').textContent = OBJECTIF+' kg';

  if(!keys.length){
    actEl.textContent='—'; ecartEl.textContent='—';
    evolEl.textContent='—'; evolEl.style.color='#6b6a75'; evolSubEl.textContent='depuis le début';
    return;
  }
  var lastKey = keys[keys.length-1];
  var lastVal = allData[lastKey];
  actEl.textContent = lastVal+' kg';
  var ecart = Math.round((lastVal-OBJECTIF)*10)/10;
  ecartEl.textContent = ecart>0 ? ('+'+ecart+' kg à perdre') : (ecart<0 ? (Math.abs(ecart)+' kg sous l\'objectif') : 'objectif atteint !');

  var firstKey = keys[0];
  var firstVal = allData[firstKey];
  var evol = Math.round((lastVal-firstVal)*10)/10;
  evolEl.textContent = (evol>0?'+':'')+evol+' kg';
  evolEl.style.color = evol<0 ? '#4ECDC4' : (evol>0 ? '#F9A825' : '#6b6a75');
  var firstD = parseKey(firstKey);
  evolSubEl.textContent = 'depuis le '+pad2(firstD.getDate())+'/'+pad2(firstD.getMonth()+1);
}

function setChartPeriod(days){
  chartPeriod = days;
  document.getElementById('btn-p-30').classList.toggle('active', days===30);
  document.getElementById('btn-p-90').classList.toggle('active', days===90);
  document.getElementById('btn-p-all').classList.toggle('active', days===0);
  renderChart();
}

function renderChart(){
  var keys = sortedKeys();
  var canvas = document.getElementById('chart-canvas');
  var empty = document.getElementById('chart-empty');

  var points = keys.map(function(k){ return {d:parseKey(k), kg:allData[k]}; });
  if(chartPeriod>0){
    var cutoff = new Date(); cutoff.setHours(0,0,0,0); cutoff.setDate(cutoff.getDate()-chartPeriod);
    points = points.filter(function(p){ return p.d.getTime()>=cutoff.getTime(); });
  }

  if(points.length<2){
    empty.style.display='block';
    canvas.style.display='none';
    if(points.length===1) empty.textContent='Encore un relevé pour tracer la courbe';
    else empty.textContent='Ajoute des relevés pour voir ta courbe';
    return;
  }
  empty.style.display='none';
  canvas.style.display='block';

  var ctx = canvas.getContext('2d');
  if(!ctx) return;
  var dpr = window.devicePixelRatio || 1;
  var cssWidth = canvas.clientWidth || canvas.parentElement.clientWidth || 300;
  var cssHeight = 160;
  canvas.width = cssWidth*dpr;
  canvas.height = cssHeight*dpr;
  canvas.style.height = cssHeight+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cssWidth,cssHeight);

  var padL=36, padR=10, padT=14, padB=20;
  var w = cssWidth-padL-padR;
  var h = cssHeight-padT-padB;

  var kgs = points.map(function(p){return p.kg;}).concat([OBJECTIF]);
  var minKg = Math.min.apply(null,kgs)-1;
  var maxKg = Math.max.apply(null,kgs)+1;
  if(maxKg-minKg<2){ maxKg=minKg+2; }

  function xOf(i){ return padL + (points.length===1?0:(w*i/(points.length-1))); }
  function yOf(kg){ return padT + h*(1-(kg-minKg)/(maxKg-minKg)); }

  // gridlines + y labels (3 lines)
  ctx.strokeStyle='#2a2a35'; ctx.lineWidth=1; ctx.font='10px sans-serif'; ctx.fillStyle='#6b6a75';
  for(var g=0;g<=2;g++){
    var gy = padT + h*g/2;
    ctx.beginPath(); ctx.moveTo(padL,gy); ctx.lineTo(padL+w,gy); ctx.stroke();
    var kgLbl = Math.round((maxKg - (maxKg-minKg)*g/2)*10)/10;
    ctx.fillText(kgLbl+'', 2, gy+3);
  }

  // objectif line (dashed)
  var oy = yOf(OBJECTIF);
  ctx.save();
  ctx.strokeStyle='#4ECDC4'; ctx.setLineDash([4,3]); ctx.lineWidth=1.3;
  ctx.beginPath(); ctx.moveTo(padL,oy); ctx.lineTo(padL+w,oy); ctx.stroke();
  ctx.restore();

  // area fill
  ctx.beginPath();
  ctx.moveTo(xOf(0), yOf(points[0].kg));
  points.forEach(function(p,i){ ctx.lineTo(xOf(i), yOf(p.kg)); });
  ctx.lineTo(xOf(points.length-1), padT+h);
  ctx.lineTo(xOf(0), padT+h);
  ctx.closePath();
  var grad = ctx.createLinearGradient(0,padT,0,padT+h);
  grad.addColorStop(0,'rgba(92,107,192,.35)');
  grad.addColorStop(1,'rgba(92,107,192,0)');
  ctx.fillStyle=grad; ctx.fill();

  // line
  ctx.beginPath();
  points.forEach(function(p,i){
    var x=xOf(i), y=yOf(p.kg);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.strokeStyle='#7986CB'; ctx.lineWidth=2.2; ctx.lineJoin='round'; ctx.stroke();

  // dots
  points.forEach(function(p,i){
    ctx.beginPath();
    ctx.arc(xOf(i), yOf(p.kg), i===points.length-1?4:2.5, 0, Math.PI*2);
    ctx.fillStyle = i===points.length-1?'#4ECDC4':'#7986CB';
    ctx.fill();
  });

  // x labels: first and last date
  ctx.fillStyle='#6b6a75'; ctx.font='10px sans-serif';
  var d0=points[0].d, d1=points[points.length-1].d;
  ctx.fillText(pad2(d0.getDate())+'/'+pad2(d0.getMonth()+1), padL, cssHeight-4);
  var lastLbl=pad2(d1.getDate())+'/'+pad2(d1.getMonth()+1);
  ctx.fillText(lastLbl, padL+w-ctx.measureText(lastLbl).width, cssHeight-4);
}

function renderHistory(){
  var keys = sortedKeys().slice(-14).reverse();
  var list = document.getElementById('hist-list');
  if(!keys.length){
    list.innerHTML = '<div class="hist-row"><span class="hist-date" style="color:#6b6a75;font-style:italic">Aucun relevé pour l\'instant</span></div>';
    return;
  }
  var html = keys.map(function(k,idx){
    var d = parseKey(k);
    var isToday = k===todayKey();
    var lbl = (isToday?'Aujourd\'hui · ':'')+JOURS_LABEL[d.getDay()]+' '+pad2(d.getDate())+'/'+pad2(d.getMonth()+1);
    var kg = allData[k];
    var deltaHtml = '';
    var olderIdx = sortedKeys().indexOf(k)-1;
    var allKeys = sortedKeys();
    var pos = allKeys.indexOf(k);
    if(pos>0){
      var prevKg = allData[allKeys[pos-1]];
      var d2 = Math.round((kg-prevKg)*10)/10;
      var color = d2<0?'#4ECDC4':(d2>0?'#F9A825':'#6b6a75');
      deltaHtml = '<span class="hist-delta" style="color:'+color+'">'+(d2>0?'+':'')+(d2===0?'=':d2)+'</span>';
    } else {
      deltaHtml = '<span class="hist-delta" style="color:#6b6a75">—</span>';
    }
    return '<div class="hist-row"><span class="hist-date">'+lbl+'</span><span class="hist-kg">'+kg+' kg</span>'+deltaHtml+'</div>';
  }).join('');
  list.innerHTML = html;
}

// Init
loadAllData();
loadCurrentDay();
</script>
</body>
</html>
