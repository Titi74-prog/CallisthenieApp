<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1a2e">
<title>Affinement — Marianne</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f0f13;color:#f0efec;overflow:hidden}
:root{--bg:#0f0f13;--white:#1a1a22;--txt:#f0efec;--txt2:#b0aeb8;--txt3:#6b6a75;--border:#2a2a35;}
#app{display:flex;flex-direction:column;height:100vh;max-width:430px;margin:0 auto;background:var(--bg)}
#header{background:#1a1a22;padding:20px 16px 14px;flex-shrink:0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start}
#header h1{font-size:22px;font-weight:800;color:var(--txt);letter-spacing:-.5px;line-height:1.1}
#header h1 span{color:#9C4A87}
#header .header-sub{display:flex;align-items:center;gap:8px;margin-top:6px}
#header .h-dot{width:5px;height:5px;border-radius:50%;background:linear-gradient(135deg,#9C4A87,#A29BFE)}
#header .h-tag{font-size:12px;font-weight:600;color:var(--txt3)}
#tabs{display:flex;background:#1a1a22;overflow-x:auto;scrollbar-width:none;flex-shrink:0;border-bottom:2px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,.04)}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:0;padding:9px 4px;font-size:11px;font-weight:700;color:var(--txt3);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;text-align:center;transition:color .2s;white-space:nowrap}
.tab .tab-sub{display:block;font-size:9px;font-weight:500;margin-top:2px;color:var(--txt3)}
.tab.active{color:#9C4A87;border-bottom-color:#9C4A87}
.tab.active .tab-sub{color:#9C4A87}
#content{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
.session-header{padding:14px 16px;background:#1a1a22;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.session-badge{width:56px;height:56px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;font-weight:800;line-height:1.1}
.session-badge .s-icon{font-size:20px}
.session-badge .s-lbl{font-size:8px;color:#fff;opacity:.9;text-transform:uppercase;letter-spacing:.3px;margin-top:2px;text-align:center;white-space:nowrap;width:100%;padding:0 4px}
.session-title{font-size:15px;font-weight:700;color:var(--txt);margin-bottom:3px}
.session-meta{font-size:11px;color:var(--txt2)}
.session-tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin-right:4px}
.progress-wrap{padding:10px 16px;background:#1a1a22;border-bottom:1px solid var(--border)}
.progress-row{display:flex;justify-content:space-between;margin-bottom:6px}
.progress-lbl{font-size:12px;font-weight:600;color:var(--txt2)}
.progress-pct{font-size:13px;font-weight:700}
.progress-track{background:var(--border);border-radius:8px;height:7px;overflow:hidden}
.progress-fill{height:7px;border-radius:8px;transition:width .5s}
.round-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#1a1a22;border-bottom:1px solid var(--border);flex-wrap:wrap}
.round-lbl{font-size:12px;font-weight:700;color:var(--txt2)}
.round-btn{width:36px;height:36px;border-radius:50%;border:2px solid;font-size:14px;font-weight:700;cursor:pointer;-webkit-appearance:none;transition:all .2s}
.round-rest-btn{margin-left:auto;border:none;color:#fff;font-size:12px;font-weight:700;padding:8px 12px;border-radius:20px;cursor:pointer;-webkit-appearance:none}
.warm-section{padding:12px 16px;background:#0d1f1a;border-bottom:1px solid #ddf2ec}
.warm-title{font-size:11px;font-weight:700;color:#4ECDC4;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.warm-item{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid rgba(127,205,187,.2)}
.warm-item:last-child{border:none}
.warm-item-txt{flex:1;font-size:13px;color:var(--txt);font-weight:500}
.warm-item-sub{font-size:11px;color:var(--txt3)}
.warm-badge{color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.bloc-titre{margin:8px 0 4px;padding:8px 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;border-radius:10px}
.exo-list{padding:12px 12px 24px}
.exo-card{background:#1a1a22;border:1.5px solid var(--border);border-radius:16px;margin-bottom:10px;overflow:hidden;cursor:pointer;transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.exo-card.open{box-shadow:0 4px 18px rgba(0,0,0,.1)}
.exo-card.done{opacity:.55}
.exo-card-header{display:flex;align-items:center;padding:13px 14px;gap:12px}
.exo-num{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.exo-num.is-done{background:linear-gradient(135deg,#7FCDBB,#A29BFE)!important;color:#fff!important}
.exo-info{flex:1;min-width:0}
.exo-name{font-size:14px;font-weight:700;color:var(--txt);margin-bottom:3px}
.badge-row{display:flex;gap:5px;flex-wrap:wrap}
.badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px}
.exo-chevron{font-size:20px;color:var(--txt3);transition:transform .25s;line-height:1;flex-shrink:0}
.exo-card.open .exo-chevron{transform:rotate(180deg)}
.exo-detail{display:none;border-top:1px solid var(--border)}
.exo-card.open .exo-detail{display:block}
.exo-body{padding:13px 14px}
.steps-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.step{display:flex;gap:10px;margin-bottom:9px;align-items:flex-start}
.step-num{width:22px;height:22px;min-width:22px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.step-txt{font-size:13px;color:var(--txt2);line-height:1.55}
.tip-box{background:#1f1a08;border-radius:10px;padding:10px 12px;margin:8px 0 4px;font-size:12px;color:#ffd93d;line-height:1.55;border-left:3px solid #ffd93d}
.err-box{background:#1f0808;border-radius:10px;padding:10px 12px;margin:6px 0;font-size:12px;color:#FF6B6B;line-height:1.55;border-left:3px solid #FF6B6B}
.btn-row{display:flex;gap:8px;margin-top:12px}
.btn-row .btn-timer{margin-top:0;flex:1}
.btn-timer{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:none;font-size:13px;font-weight:700;padding:11px 10px;border-radius:12px;cursor:pointer;-webkit-appearance:none}
.btn-hold{background:linear-gradient(135deg,#7FCDBB,#4ECDC4);color:#fff}
.btn-rest{background:rgba(255,255,255,.08);color:#b0aeb8;border:1.5px solid #3a3a45}
.btn-done{display:flex;align-items:center;gap:8px;width:100%;background:#1a1a22;border:1.5px solid var(--border);color:var(--txt2);font-size:13px;font-weight:600;padding:10px 16px;border-radius:12px;cursor:pointer;margin-top:8px;-webkit-appearance:none;justify-content:center}
.btn-done.is-done{border-color:#7FCDBB;color:#4daa95;background:#EEFAF7}
.conseil{margin:0 12px 80px;border-radius:16px;padding:13px 14px;font-size:12px;line-height:1.7;border:1px solid}
.conseil-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.repos-wrap{padding:16px}
.repos-card{background:#1a1a22;border:1.5px solid var(--border);border-radius:16px;padding:18px;margin-bottom:12px;text-align:center}
.repos-icon{font-size:36px;margin-bottom:8px}
.repos-title{font-size:15px;font-weight:700;color:var(--txt);margin-bottom:6px}
.repos-txt{font-size:13px;color:var(--txt2);line-height:1.6}
#timer-overlay{display:none;position:fixed;inset:0;background:rgba(26,26,46,.93);z-index:100;align-items:center;justify-content:center;flex-direction:column;backdrop-filter:blur(4px)}
#timer-overlay.show{display:flex}
#timer-label{font-size:14px;font-weight:700;color:#E8B4CB;margin-bottom:12px;text-align:center;padding:0 24px}
#timer-ring{position:relative;width:190px;height:190px;margin:8px 0}
#timer-ring svg{width:190px;height:190px;transform:rotate(-90deg)}
#timer-ring .ring-bg{fill:none;stroke:rgba(255,255,255,.1);stroke-width:10}
#timer-ring .ring-fg{fill:none;stroke:#9C4A87;stroke-width:10;stroke-linecap:round;stroke-dasharray:534;stroke-dashoffset:0;transition:stroke-dashoffset .9s linear}
#timer-num{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:58px;font-weight:800;color:#fff;line-height:1}
#timer-sec{font-size:14px;color:rgba(255,255,255,.5);margin-bottom:24px;margin-top:4px}
#btn-stop{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.25);color:#fff;font-size:15px;font-weight:600;padding:13px 36px;border-radius:16px;cursor:pointer;-webkit-appearance:none}
</style>
</head>
<body>
<div id="app">
<div id="header">
  <div>
    <h1>Affinement · <span>Marianne</span></h1>
    <div class="header-sub">
      <div class="h-dot"></div>
      <span class="h-tag">6 séances / semaine</span>
    </div>
  </div>
  <div id="header-time" style="font-size:18px;font-weight:700;color:var(--txt3);padding-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.5px"></div>
</div>
<div id="tabs"></div>
<div id="content"></div>
</div>
<div id="timer-overlay">
  <div id="timer-label">Repos</div>
  <div id="timer-ring">
    <svg viewBox="0 0 190 190"><circle class="ring-bg" cx="95" cy="95" r="85"/><circle class="ring-fg" id="ring-fg" cx="95" cy="95" r="85"/></svg>
    <div id="timer-num">0</div>
  </div>
  <div id="timer-sec">secondes</div>
  <button id="btn-stop" onclick="stopTimer()">Arreter</button>
</div>
<script>
var COLORS={
  LU:{bg:'#5C6BC0',light:'#eef0fb',badge:'#5C6BC0',grad:'linear-gradient(135deg,#5C6BC0,#7986CB)'},
  MA:{bg:'#26A69A',light:'#e8f6f5',badge:'#26A69A',grad:'linear-gradient(135deg,#26A69A,#4DB6AC)'},
  ME:{bg:'#7E57C2',light:'#f3f0fb',badge:'#7E57C2',grad:'linear-gradient(135deg,#7E57C2,#9575CD)'},
  JE:{bg:'#EF5350',light:'#fef0f0',badge:'#EF5350',grad:'linear-gradient(135deg,#EF5350,#E57373)'},
  VE:{bg:'#FF7043',light:'#fff2ee',badge:'#FF7043',grad:'linear-gradient(135deg,#FF7043,#FF8A65)'},
  SA:{bg:'#F9A825',light:'#fffbec',badge:'#F57F17',grad:'linear-gradient(135deg,#FDD835,#F9A825)'},
  DI:{bg:'#66BB6A',light:'#edf7ee',badge:'#43A047',grad:'linear-gradient(135deg,#66BB6A,#81C784)'},
};

var DAYS=[
  {tab:'Lun',sub:'Gainage'},
  {tab:'Mar',sub:'Dos'},
  {tab:'Mer',sub:'Jambes'},
  {tab:'Jeu',sub:'Mobilite'},
  {tab:'Ven',sub:'Circuit'},
  {tab:'Sam',sub:'Full body'},
  {tab:'Dim',sub:'Yoga'},
  {tab:'Dim',sub:'Repos'},
];

/* ── SESSIONS ── */
var SESSIONS=[
/* LUNDI — Gainage & abdos profonds */
{id:'LU',col:'LU',name:'Lun',sub:'Gainage & Abdos profonds',tag:'Soir',icon:'🎯',
conseil:'Le soir apres une journee de travail, le gainage est ideal : pas d\'impact, mouvements lents et controles. Le transverse se renforce sans epuiser le corps.',
warmup:[
  {n:'Rotations cervicales et epaules',d:'Lent, denouer les tensions',b:'2x10'},
  {n:'Cat-Cow',d:'Reveil de la colonne',b:'2x8'},
  {n:'Respirations profondes',d:'Expirer a fond, rentrer le ventre',b:'5 resp.'},
],
exos:[
  {name:'Planche frontale — tenue progressive',reps:'3 x 30 sec',rest:45,hold:30,
   steps:['Avant-bras au sol, coudes sous les epaules.','Corps aligne tete-talon, nombril rentre vers la colonne.','Fessiers contractes, respiration lente et reguliere.','Augmenter de 5 sec chaque semaine.'],
   tip:'💡 Objectif a 8 semaines : 60 sec. Notez votre temps a chaque seance.',
   erreur:'⚠ Si le dos s\'affaisse, posez les genoux plutot que de tenir en mauvaise position.'},
  {name:'Planche laterale — tenue',reps:'3 x 20 sec / cote',rest:30,hold:20,
   steps:['Sur le cote, appui sur l\'avant-bras et le bord du pied.','Lever les hanches — corps aligne de la tete aux pieds.','Bras libre tendu vers le plafond ou pose sur la hanche.','Tenir sans laisser les hanches descendre.'],
   tip:'💡 Version genoux poses au debut : tout aussi efficace.',
   erreur:'⚠ Hanches qui s\'affaissent = les obliques ne travaillent plus.'},
  {name:'Dead Bug — tempo lent',reps:'3 x 8 rep./cote',rest:45,hold:0,
   steps:['Allongee sur le dos, DOS PLAQUE au sol — regle absolue.','Bras tendus au plafond, genoux a 90 degrees.','Descendre bras droit + jambe gauche lentement en 4 secondes en expirant.','Si le dos decolle : reduire l\'amplitude.'],
   tip:'💡 Meilleur exercice pour la stabilite lombaire. Peut etre fait quotidiennement.',
   erreur:'⚠ Le dos NE DOIT PAS decoller. Amplitude reduite si necessaire.'},
  {name:'Vacuum abdominal',reps:'3 x 20 sec',rest:30,hold:20,
   steps:['Debout, assise ou a 4 pattes.','Expirer a fond — vider completement les poumons.','Rentrer le nombril vers la colonne au maximum.','Tenir 20 sec, respiration courte et superficielle.'],
   tip:'💡 L\'exercice ventre plat n°1. A refaire aussi debout dans la journee.',
   erreur:'⚠ C\'est une retraction vers l\'interieur, pas une contraction vers le haut.'},
  {name:'Pont fessier — tenue isometrique',reps:'3 x 40 sec',rest:45,hold:40,
   steps:['Allongee, genoux a 90 degrees, pieds a plat.','Monter les hanches en contractant les fessiers.','Maintenir la position haute 40 secondes — ne pas redescendre.','Respiration lente et reguliere pendant la tenue.'],
   tip:'💡 La tenue isometrique est plus efficace que les repetitions pour tonifier.',
   erreur:'⚠ Le mouvement vient des fessiers, pas du bas du dos.'},
  {name:'Planche prono-supination',reps:'3 x 6 rep./cote',rest:45,hold:0,
   steps:['En planche avant-bras (position planche classique).','Pivoter en planche laterale droite en 3 secondes.','Tenir 2 secondes, revenir en planche frontale.','Pivoter cote gauche. Enchainement fluide.'],
   tip:'💡 Excellent pour les obliques et la stabilite totale du tronc.',
   erreur:'⚠ Les hanches restent stables — ne pas les laisser monter ou descendre.'},
]},

/* MARDI — Dos & Posture */
{id:'MA',col:'MA',name:'Mar',sub:'Dos & Posture',tag:'Soir',icon:'🌿',
conseil:'Apres une journee souvent assise, le dos a besoin d\'etre renforce et etire. Mouvements lents, amplitude complete, contraction consciente a chaque repetition.',
warmup:[
  {n:'Rotations epaules et buste',d:'Amplitude progressive',b:'2x10'},
  {n:'Cat-Cow',d:'Mobilite de la colonne',b:'2x8'},
  {n:'Inclinaisons laterales',d:'Doux, chaque cote',b:'1x8/cote'},
],
exos:[
  {name:'Superman — tenue 3 secondes',reps:'3 x 10 rep.',rest:45,hold:0,
   steps:['Allongee ventre, bras tendus devant la tete.','Lever simultanement bras ET jambes en expirant.','Tenir 3 secondes en haut — contraction maximale du dos.','Redescente lente sans toucher le sol entre les reps.'],
   tip:'💡 3 secondes de tenue = bien plus efficace que les repetitions rapides.',
   erreur:'⚠ Membres tendus — ne pliez ni les coudes ni les genoux.'},
  {name:'Reverse Hyper — tempo lent',reps:'3 x 12 rep.',rest:45,hold:0,
   steps:['Allongee ventre sur le tapis, bras replie sous le front.','Jambes tendues et jointes, expirer.','Lever les deux jambes tendues en 2 secondes.','Tenir 2 secondes en haut, descendre en 3 secondes.'],
   tip:'💡 Protege et renforce les lombaires sans pression sur la colonne.',
   erreur:'⚠ Ne pas plier les genoux — jambes tendues tout au long.'},
  {name:'Bird-Dog — pause longue',reps:'3 x 8 rep./cote',rest:45,hold:0,
   steps:['A 4 pattes, dos plat comme une table.','Tendre bras droit + jambe gauche a l\'horizontale.','Tenir 4 secondes en contractant fort les abdos et les fessiers.','Revenir lentement et alterner.'],
   tip:'💡 4 secondes de tension = gainage profond bien plus intense que la version rapide.',
   erreur:'⚠ Le bassin ne pivote pas — hanches paralleles au sol pendant les 4 sec.'},
  {name:'Extension dorsale au sol (Cobra actif)',reps:'3 x 12 rep.',rest:45,hold:0,
   steps:['Allongee ventre, bras le long du corps paumes vers le bas.','Expirer et decoller le buste du sol en contractant les lombaires.','Les bras restent le long du corps — ne pas pousser avec les mains.','Tenir 2 secondes en haut, redescendre lentement sur 3 secondes.'],
   tip:'💡 Sans les mains = travail lombaire pur. Plus difficile que ca en a l\'air.',
   erreur:'⚠ Ne pas utiliser les bras pour se pousser — ils restent colles au corps.'},
  {name:'Etirement dos complet — tenu',reps:'3 x 30 sec',rest:20,hold:30,
   steps:['Debout ou assise, entrelacer les doigts devant soi.','Pousser les paumes vers l\'exterieur en arrondissant le dos.','Laisser la tete tomber doucement vers l\'avant.','Sentir l\'etirement entre les omoplates — 30 secondes.'],
   tip:'💡 Parfait pour terminer la seance apres les contractions du dos.',
   erreur:'⚠ Ne forcez pas la tete vers le bas — le poids naturel suffit.'},
]},

/* MERCREDI — Jambes & Fessiers */
{id:'ME',col:'ME',name:'Mer',sub:'Jambes & Fessiers',tag:'Soir',icon:'🦵',
conseil:'Le soir, les jambes sont fatigues. On privilegie les mouvements isometriques et le tempo lent plutot que les sauts ou la vitesse. Meme efficacite, moins d\'impact.',
warmup:[
  {n:'Rotations de hanches',d:'Grands cercles progressifs',b:'2x10'},
  {n:'Fentes statiques',d:'Maintien 5 sec, ouverture hanches',b:'1x5/jambe'},
  {n:'Cat-Cow',d:'Mobilite colonne',b:'2x8'},
],
exos:[
  {name:'Squats — tempo lent',reps:'3 x 12 rep.',rest:60,hold:0,
   steps:['Pieds largeur epaules, orteils legerement ouverts.','Descente lente sur 4 secondes — cuisses paralleles au sol.','Pause 1 seconde en bas.','Remontee en 2 secondes en expirant.'],
   tip:'💡 Le tempo lent intensifie sans ajouter de poids. La pause en bas est cle.',
   erreur:'⚠ Les genoux restent dans l\'axe des orteils — ne pas les laisser rentrer.'},
  {name:'Chaise contre le mur — tenue',reps:'3 x 40 sec',rest:60,hold:40,
   steps:['Dos plaque contre le mur.','Descendre jusqu\'a cuisses paralleles au sol — 90 degrees.','Tenir 40 secondes sans bouger.','Respiration lente et reguliere pendant la tenue.'],
   tip:'💡 Cuisses en feu = metabolisme qui s\'active. Plus efficace qu\'on ne le croit.',
   erreur:'⚠ Ne pas laisser les genoux depasser les orteils.'},
  {name:'Pont fessier — unilateral',reps:'3 x 10 rep./jambe',rest:45,hold:0,
   steps:['Allongee, genoux a 90 degrees, lever le pied droit.','Monter les hanches en poussant sur le talon gauche uniquement.','Tenir 2 secondes en haut, descendre lentement.','Faire toute la serie d\'un cote puis alterner.'],
   tip:'💡 Version unilaterale = bien plus difficile que le pont classique. Corrige les desequilibres.',
   erreur:'⚠ Le bassin ne doit pas pencher d\'un cote — garder les hanches de niveau.'},
  {name:'Releves de jambes — allonge (tapis)',reps:'3 x 12 rep.',rest:60,hold:0,
   steps:['Allongee sur le dos, mains sous les fesses.','Jambes tendues, partir a la verticale (90 degrees).','Descendre les jambes lentement vers le sol en 4 secondes.','Remonter en expirant — dos plaque en permanence.'],
   tip:'💡 Plus les jambes descendent bas, plus c\'est difficile. Commencez a 45 degrees.',
   erreur:'⚠ Le dos ne doit jamais se cambrer — mains sous les fesses si besoin.'},
  {name:'Fente statique — isometrie',reps:'3 x 30 sec / jambe',rest:45,hold:30,
   steps:['En fente basse, pied avant avance, genou a 90 degrees.','Genou arriere a quelques cm du sol.','Tenir la position 30 secondes sans bouger.','Buste droit, respiration reguliere.'],
   tip:'💡 L\'isometrie en fente tonifie cuisses et fessiers sans fatigue articulaire.',
   erreur:'⚠ Le genou avant ne depasse pas les orteils.'},
]},

/* JEUDI — Mobilite & Recuperation active */
{id:'JE',col:'JE',name:'Jeu',sub:'Mobilite & Recuperation',tag:'Soir',icon:'🧘',
conseil:'Le jeudi est la seance la plus importante pour la perinomopause : elle fait baisser le cortisol. Ne la sautez pas meme si vous etes fatiguee — c\'est justement quand ca compte le plus.',
warmup:[],
repos:false,
exos:[
  {name:'Marche douce sur place',reps:'8 min',rest:0,hold:480,
   steps:['Marche lente et reguliere sur place.','Bras qui se balancent naturellement.','Respiration profonde — inspirer par le nez, expirer par la bouche.','Denouer les tensions de la journee.'],
   tip:'💡 8 minutes de marche active la recuperation sans fatiguer le corps.',
   erreur:''},
  {name:'Torsion spinale allongee',reps:'45 sec / cote',rest:15,hold:45,
   steps:['Allongee sur le dos, bras en croix.','Ramener le genou droit de l\'autre cote.','Epaule droite reste au sol — regarder a gauche.','45 secondes puis alterner.'],
   tip:'💡 Inspirez en position neutre, expirez en laissant le genou descendre.',
   erreur:'⚠ Ne forcez pas — la gravite suffit.'},

var currentTab=0,doneExos={},timerInterval=null,timerTotal=0,timerLeft=0;

function updateClock(){
  var now=new Date();
  var h=String(now.getHours()).padStart(2,'0');
  var m=String(now.getMinutes()).padStart(2,'0');
  var el=document.getElementById('header-time');
  if(el)el.textContent=h+':'+m;
}
updateClock();
setInterval(updateClock,10000);

function buildTabs(){
  var bar=document.getElementById('tabs');
  bar.innerHTML='';
  DAYS.forEach(function(d,i){
    var el=document.createElement('div');
    el.className='tab'+(i===0?' active':'');
    el.innerHTML=d.tab+'<span class="tab-sub">'+d.sub+'</span>';
    el.onclick=(function(idx){return function(){showTab(idx);};})(i);
    bar.appendChild(el);
  });
}

function showTab(i){
  currentTab=i;
  document.querySelectorAll('.tab').forEach(function(t,j){t.classList.toggle('active',j===i);});
  renderSession(SESSIONS[i]);
}

function makeCard(ex,i,s,dk,C){
  var done=dk[i];
  return '<div class="exo-card'+(done?' done':'')+'" id="card-'+s.id+'-'+i+'" onclick="toggleCard(\''+s.id+'\','+i+')">'
    +'<div class="exo-card-header">'
    +'<div class="exo-num'+(done?' is-done':'')+'" style="background:'+(done?'linear-gradient(135deg,#7FCDBB,#A29BFE)':C.light)+';color:'+(done?'#fff':C.badge)+'">'+(done?'&#x2713;':(i+1))+'</div>'
    +'<div class="exo-info"><div class="exo-name">'+ex.name+'</div>'
    +'<div class="badge-row">'
    +'<span class="badge" style="background:'+C.light+';color:'+C.badge+'">'+ex.reps+'</span>'
    +(ex.hold>0?'<span class="badge" style="background:#fff8e0;color:#b8860b">&#x23F1; '+ex.hold+'s</span>':'')
    +'</div></div>'
    +'<span class="exo-chevron">&#x2304;</span></div>'
    +'<div class="exo-detail"><div class="exo-body">'
    +'<div class="steps-title" style="color:'+C.bg+'">&#x1F4CB; Technique</div>'
    +ex.steps.map(function(st,n){return '<div class="step"><div class="step-num" style="background:'+C.bg+'">'+(n+1)+'</div><div class="step-txt">'+st+'</div></div>';}).join('')
    +(ex.tip?'<div class="tip-box">'+ex.tip+'</div>':'')
    +(ex.erreur?'<div class="err-box">'+ex.erreur+'</div>':'')
    +'<div class="btn-row">'
    +(ex.hold>0?'<button class="btn-timer btn-hold" onclick="event.stopPropagation();startTimer('+ex.hold+',\'&#x1F3CB; Exercice\')">&#x1F3CB; Exercice '+ex.hold+'s</button>':'')
    +(ex.rest>0?'<button class="btn-timer btn-rest" onclick="event.stopPropagation();startTimer('+ex.rest+',\'&#x23F1; Repos\')">&#x23F1; Repos '+ex.rest+'s</button>':'')
    +'</div>'
    +'<button class="btn-done'+(done?' is-done':'')+'" onclick="event.stopPropagation();markDone(\''+s.id+'\','+i+')">'+(done?'&#x21A9; Marquer non fait':'&#x2713; Exercice termin&#233;')+'</button>'
    +'</div></div></div>';
}

function renderSession(s){
  var C=COLORS[s.col];
  var dk=doneExos[s.id]||{};
  var allExos=s.blocs?s.blocs.reduce(function(a,b){return a.concat(b.exos);},[]):s.exos;
  var doneCount=Object.keys(dk).filter(function(k){return k.indexOf('__')<0;}).length;
  var total=allExos.length;
  var pct=total?Math.round(doneCount/total*100):0;
  var html='';

  html+='<div class="session-header">'
    +'<div class="session-badge" style="background:'+C.grad+'">'
    +'<span class="s-icon">'+s.icon+'</span>'
    +'<span class="s-lbl">'+s.name+'</span>'
    +'</div>'
    +'<div><div class="session-title">'+s.name+' — '+s.sub+'</div>'
    +'<div class="session-meta"><span class="session-tag" style="background:'+C.light+';color:'+C.badge+'">'+s.tag+'</span></div>'
    +'</div></div>';

  if(!s.repos){
    html+='<div class="progress-wrap">'
      +'<div class="progress-row"><span class="progress-lbl">Progression</span><span class="progress-pct" style="color:'+C.bg+'">'+pct+'%</span></div>'
      +'<div class="progress-track"><div class="progress-fill" style="background:'+C.grad+';width:'+pct+'%"></div></div>'
      +'</div>';
  }

  if(s.warmup&&s.warmup.length>0){
    html+='<div class="warm-section"><div class="warm-title">&#x1F525; Echauffement</div>';
    s.warmup.forEach(function(w){
      html+='<div class="warm-item"><div class="warm-item-txt">'+w.n+'<br><span class="warm-item-sub">'+w.d+'</span></div>'
        +'<span class="warm-badge" style="background:'+C.bg+'">'+w.b+'</span></div>';
    });
    html+='</div>';
  }

  if(s.repos){
    html+='<div class="repos-wrap"><div class="repos-card" style="border-color:'+C.bg+'33">'
      +'<div class="repos-icon">🌸</div>'
      +'<div class="repos-title">Journee de recuperation</div>'
      +'<div class="repos-txt">Marche douce + etirements complets.</div>'
      +'</div></div>';
  }

  if(s.blocs&&s.blocs.length>0){
    html+='<div class="exo-list">';
    s.blocs.forEach(function(bloc,b){
      html+='<div class="bloc-titre" style="background:'+C.light+';color:'+C.badge+'">'+bloc.titre+'</div>';
      if(bloc.type==='rounds'){
        var curRound=doneExos['__round_'+s.id]||1;
        html+='<div class="round-bar">'
          +'<span class="round-lbl">Tour</span>'
          +[1,2,3].map(function(r){
            return '<button class="round-btn'+(curRound===r?' active':'')+'" '
              +'style="'+(curRound===r?'background:'+C.bg+';color:#fff;border-color:'+C.bg:'background:#fff;color:'+C.badge+';border-color:'+C.badge)+'" '
              +'onclick="setRound(\''+s.id+'\','+r+')">'+r+'</button>';
          }).join('')
          +'<button class="round-rest-btn" style="background:'+C.grad+'" onclick="startTimer(90,\'&#x23F1; Repos entre les tours\')">&#x23F1; Repos 90s</button>'
          +'</div>';
      }
      var offset=b*100;
      bloc.exos.forEach(function(ex,i){html+=makeCard(ex,offset+i,s,dk,C);});
    });
    html+='</div>';
  } else {
    if(!s.repos){
      var curRound=doneExos['__round_'+s.id]||1;
      html+='<div class="round-bar">'
        +'<span class="round-lbl">Tour</span>'
        +[1,2,3].map(function(r){
          return '<button class="round-btn'+(curRound===r?' active':'')+'" '
            +'style="'+(curRound===r?'background:'+C.bg+';color:#fff;border-color:'+C.bg:'background:#fff;color:'+C.badge+';border-color:'+C.badge)+'" '
            +'onclick="setRound(\''+s.id+'\','+r+')">'+r+'</button>';
        }).join('')
        +'<button class="round-rest-btn" style="background:'+C.grad+'" onclick="startTimer(90,\'&#x23F1; Repos entre les tours\')">&#x23F1; Repos 90s</button>'
        +'</div>';
    }
    html+='<div class="exo-list">';
    s.exos.forEach(function(ex,i){html+=makeCard(ex,i,s,dk,C);});
    html+='</div>';
  }

  html+='<div class="conseil" style="background:rgba(255,255,255,.06);border-color:'+C.bg+'55">'
    +'<div class="conseil-title" style="color:'+C.bg+'">&#x1F4A1; Conseil</div>'+s.conseil+'</div>';

  document.getElementById('content').innerHTML=html;
  document.getElementById('content').scrollTop=0;
}

function setRound(sid,r){
  doneExos['__round_'+sid]=r;
  renderSession(SESSIONS[currentTab]);
}

function toggleCard(sid,i){
  var card=document.getElementById('card-'+sid+'-'+i);
  var isOpen=card.classList.contains('open');
  document.querySelectorAll('.exo-card.open').forEach(function(c){c.classList.remove('open');});
  if(!isOpen)card.classList.add('open');
}

function markDone(sid,i){
  if(!doneExos[sid])doneExos[sid]={};
  if(doneExos[sid][i])delete doneExos[sid][i];
  else doneExos[sid][i]=true;
  var sc=document.getElementById('content').scrollTop;
  renderSession(SESSIONS[currentTab]);
  document.getElementById('content').scrollTop=sc;
  var card=document.getElementById('card-'+sid+'-'+i);
  if(card)card.classList.add('open');
}

var wakeLock=null;
async function requestWakeLock(){try{if('wakeLock' in navigator){wakeLock=await navigator.wakeLock.request('screen');}}catch(e){}}
function releaseWakeLock(){try{if(wakeLock){wakeLock.release();wakeLock=null;}}catch(e){}}

function startTimer(sec,label){
  timerTotal=sec;timerLeft=sec;
  document.getElementById('timer-label').textContent=label||'Repos';
  document.getElementById('timer-overlay').classList.add('show');
  updateTimer();
  requestWakeLock();
  clearInterval(timerInterval);
  timerInterval=setInterval(function(){
    timerLeft--;updateTimer();
    if(timerLeft<=0){clearInterval(timerInterval);releaseWakeLock();setTimeout(stopTimer,900);}
  },1000);
}

function updateTimer(){
  document.getElementById('timer-num').textContent=timerLeft;
  var fg=document.getElementById('ring-fg');
  fg.style.strokeDashoffset=534*(1-timerLeft/timerTotal);
  fg.style.stroke=timerLeft<=5?'#EF5350':timerLeft<=10?'#F9A825':'#9C4A87';
}

function stopTimer(){
  clearInterval(timerInterval);
  releaseWakeLock();
  document.getElementById('timer-overlay').classList.remove('show');
}

buildTabs();
var SESSION_IDX_M=[0,1,2,3,4,5,6,7];
renderSession(SESSIONS[0]);
</script>
