<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f0f13;color:#f0efec;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh;max-width:430px;margin:0 auto}
#header{background:#1a1a22;padding:16px;border-bottom:1px solid #2a2a35;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
#header h1{font-size:18px;font-weight:800;color:#f0efec}
#header h1 span{color:#4ECDC4}
#header-time{font-size:16px;font-weight:700;color:#6b6a75;font-variant-numeric:tabular-nums}
#padel-bar{background:#1a1a22;border-bottom:1px solid #2a2a35;padding:8px 12px;display:flex;gap:8px;align-items:center;flex-shrink:0}
.padel-btn{flex:1;padding:7px;border-radius:8px;border:1px solid #2a2a35;background:transparent;color:#b0aeb8;font-size:12px;font-weight:600;cursor:pointer}
.padel-btn.active{background:#1a1a35;border-color:#5C6BC0;color:#7986CB}
#totaux{display:flex;gap:8px;padding:12px;background:#1a1a22;border-bottom:1px solid #2a2a35;flex-shrink:0}
.tot-card{flex:1;background:#0f0f13;border-radius:10px;padding:10px;text-align:center}
.tot-label{font-size:10px;color:#6b6a75;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.tot-val{font-size:20px;font-weight:700}
.tot-sub{font-size:10px;color:#6b6a75;margin-top:2px}
#progress-bar{height:4px;background:#2a2a35;border-radius:2px;margin-top:6px;overflow:hidden}
#progress-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#5C6BC0,#4ECDC4);transition:width .4s}
#content{flex:1;overflow-y:auto;padding:12px;padding-bottom:90px}
.repas-card{background:#1a1a22;border-radius:14px;padding:12px;margin-bottom:8px}
.repas-header{display:flex;justify-content:space-between;margin-bottom:8px}
.repas-nom{font-size:12px;font-weight:700;color:#b0aeb8;text-transform:uppercase;letter-spacing:.5px}
.repas-total{font-size:12px;color:#6b6a75}
.aliment-row{display:flex;align-items:center;gap:6px;padding:5px 0;border-top:1px solid #2a2a35}
.aliment-nom{flex:1;font-size:13px;color:#f0efec}
.aliment-prot{font-size:12px;color:#4ECDC4;min-width:32px;text-align:right}
.aliment-kcal{font-size:12px;color:#b0aeb8;min-width:44px;text-align:right}
.btn-del{border:none;background:none;color:#6b6a75;font-size:20px;cursor:pointer;padding:0 4px;line-height:1}
#fab{position:fixed;bottom:58px;right:20px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#5C6BC0,#7986CB);border:none;color:#fff;font-size:28px;cursor:pointer;box-shadow:0 4px 16px rgba(92,107,192,.4);z-index:10}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;flex-direction:column;justify-content:flex-end}
#modal.show{display:flex}
#modal-inner{background:#1a1a22;border-radius:20px 20px 0 0;padding:16px;max-height:90vh;display:flex;flex-direction:column;gap:8px}
#modal-title{font-size:16px;font-weight:700;color:#f0efec}
#modal-repas-sel,#modal-search,#inp-qte{width:100%;font-size:14px;padding:10px 12px;border-radius:10px;border:1px solid #2a2a35;background:#0f0f13;color:#f0efec}
#modal-search:focus,#modal-repas-sel:focus{outline:none;border-color:#5C6BC0}
#suggestions{overflow-y:auto;border-radius:10px;background:#0f0f13;max-height:200px}
.sug-item{padding:10px 12px;border-bottom:1px solid #2a2a35;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.sug-nom{font-size:13px;color:#f0efec}
.sug-macros{font-size:11px;color:#6b6a75;text-align:right}
#qte-row{display:flex;gap:8px;align-items:center}
#qte-row label{font-size:13px;color:#b0aeb8;white-space:nowrap}
#preview-macros{display:flex;gap:6px}
.prev-card{flex:1;background:#0f0f13;border-radius:8px;padding:8px;text-align:center}
.prev-label{font-size:10px;color:#6b6a75;text-transform:uppercase}
.prev-val{font-size:14px;font-weight:700;color:#f0efec;margin-top:2px}
#btn-add-food{width:100%;padding:13px;border-radius:12px;border:none;background:linear-gradient(135deg,#5C6BC0,#7986CB);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
#btn-reset{width:100%;padding:10px;border-radius:12px;border:1px solid #2a2a35;background:transparent;color:#6b6a75;font-size:13px;cursor:pointer}
.empty-state{text-align:center;color:#6b6a75;padding:40px 20px;font-size:14px}

#bottom-nav{display:flex;background:#1a1a22;border-top:1px solid #2a2a35;padding:3px 0;position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;z-index:50}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 2px;cursor:pointer;border:none;background:none;color:#6b6a75;font-size:9px;font-weight:600}
.nav-btn.active{color:#4ECDC4}
.nav-btn span{font-size:15px}
</style>

    <div id="header-time"></div>
  </div>
  <div id="padel-bar">
    <span style="font-size:12px;color:#6b6a75">Activité :</span>
    <button class="padel-btn active" id="btn-normal" onclick="setMode('normal')">Normal · 2300</button>

    <button class="padel-btn" id="btn-padel" onclick="setMode('padel')">Padel · 2800</button>
  </div>
  <div id="totaux">
    <div class="tot-card">
      <div class="tot-label">Protéines</div>
      <div class="tot-val" id="tot-prot" style="color:#4ECDC4">0g</div>
      <div class="tot-sub">/ 160g</div>
      <div id="progress-bar"><div id="progress-fill" style="width:0%"></div></div>

</div>
<button id="fab" onclick="openModal()">+</button>
<div id="modal" onclick="closeOnBg(event)">
  <div id="modal-inner">

    <input type="text" id="modal-search" placeholder="Rechercher un aliment..." oninput="searchFood()" autocomplete="off">
    <div id="suggestions"></div>
    <div id="qte-row" style="display:none">
      <label id="qte-label">Quantité (g)</label>
      <input type="number" id="inp-qte" value="100" min="1" oninput="updatePreview()">
    </div>
    <div id="preview-macros" style="display:none">

    </div>

    <button id="btn-add-food" onclick="addFood()">Ajouter</button>
    <button id="btn-reset" onclick="resetDay()">Réinitialiser la journée</button>
  </div>
</div>

var repas=[],objectif=2300,selected=null;

function updateClock(){
  var now=new Date();
  document.getElementById('header-time').textContent=
    String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
}
function navTo(p){var m={'programme':'programme.html','nutrition':'nutrition.html','poids':'poids.html'};if(m[p])window.location.href='file:///android_asset/'+m[p];}
updateClock(); setInterval(updateClock,10000);

function setMode(m){
  objectif=m==='padel'?2800:m==='calist'?2550:2300;
  ['normal','calist','padel'].forEach(function(x){
    document.getElementById('btn-'+x).classList.toggle('active',x===m);
  });
  document.getElementById('lbl-obj').textContent='/ '+objectif+' kcal';
  render();
  try{localStorage.setItem('mode',m);}catch(e){}
}

function openModal(){document.getElementById('modal').classList.add('show');document.getElementById('modal-search').focus();}
function closeModal(){
  document.getElementById('modal').classList.remove('show');
  document.getElementById('modal-search').value='';
  document.getElementById('suggestions').innerHTML='';
  document.getElementById('qte-row').style.display='none';
  document.getElementById('preview-macros').style.display='none';
  document.getElementById('err-msg').style.display='none';
  selected=null;
}
function closeOnBg(e){if(e.target===document.getElementById('modal'))closeModal();}

function searchFood(){
  var q=document.getElementById('modal-search').value.toLowerCase().trim();
  var sug=document.getElementById('suggestions');
  selected=null;
  document.getElementById('qte-row').style.display='none';
  document.getElementById('preview-macros').style.display='none';
  if(!q){sug.innerHTML='';return;}
  var matches=DB.filter(function(d){return d.n.toLowerCase().includes(q)||(d.c||'').toLowerCase().includes(q);}).slice(0,8);
  if(!matches.length){sug.innerHTML='<div style="padding:12px;font-size:13px;color:#6b6a75;text-align:center">Aucun résultat</div>';return;}
  sug.innerHTML=matches.map(function(d){
    return '<div class="sug-item" onclick="selectFood('+DB.indexOf(d)+')"><div><div class="sug-nom">'+d.n+'</div><div class="sug-macros">'+d.c+'</div></div><div class="sug-macros">'+d.p+'g prot · '+d.k+' kcal/'+d.u+'</div></div>';
  }).join('');
}

function selectFood(i){
  selected=DB[i];
  document.getElementById('modal-search').value=selected.n;
  document.getElementById('suggestions').innerHTML='';
  if(selected.fixed){
    document.getElementById('qte-row').style.display='none';
  } else {
    document.getElementById('qte-row').style.display='flex';
    document.getElementById('qte-label').textContent='Quantité ('+selected.u+')';
    document.getElementById('inp-qte').value=selected.qte||100;
  }
  document.getElementById('preview-macros').style.display='flex';
  updatePreview();
}

function updatePreview(){
  if(!selected)return;
  var qte=selected.fixed?(selected.qte||1):(parseFloat(document.getElementById('inp-qte').value)||100);
  var f=selected.fixed?1:qte/100;
  document.getElementById('prev-prot').textContent=Math.round(selected.p*f)+'g';
  document.getElementById('prev-gluc').textContent=Math.round(selected.g*f)+'g';
  document.getElementById('prev-lip').textContent=Math.round(selected.l*f)+'g';
  document.getElementById('prev-kcal').textContent=Math.round(selected.k*f);
}

function addFood(){
  var sel=document.getElementById('modal-repas-sel').value;
  var err=document.getElementById('err-msg');
  if(!sel||!selected){err.style.display='block';return;}
  err.style.display='none';
  var qte=selected.fixed?(selected.qte||1):(parseFloat(document.getElementById('inp-qte').value)||100);
  var f=selected.fixed?1:qte/100;
  var label=selected.fixed?selected.n:selected.n+' ('+Math.round(qte)+selected.u+')';
  repas.push({sel:sel,nom:label,p:Math.round(selected.p*f*10)/10,g:Math.round(selected.g*f*10)/10,l:Math.round(selected.l*f*10)/10,k:Math.round(selected.k*f)});
  closeModal();render();
  try{localStorage.setItem('repas',JSON.stringify(repas));}catch(e){}
}

function removeFood(i){repas.splice(i,1);render();try{localStorage.setItem('repas',JSON.stringify(repas));}catch(e){}}

function resetDay(){repas=[];closeModal();render();try{localStorage.removeItem('repas');}catch(e){}}

function render(){
  var totP=0,totK=0;
  repas.forEach(function(r){totP+=r.p;totK+=r.k;});
  var pEl=document.getElementById('tot-prot');
  pEl.textContent=Math.round(totP)+'g';
  pEl.style.color=totP>=140?'#4ECDC4':totP>=100?'#F9A825':'#EF5350';
  document.getElementById('tot-kcal').textContent=Math.round(totK);
  document.getElementById('progress-fill').style.width=Math.min(100,Math.round(totP/160*100))+'%';
  var deficit=objectif-totK;
  var dEl=document.getElementById('tot-deficit');
  if(totK===0){dEl.textContent='—';dEl.style.color='#6b6a75';}
  else{dEl.textContent=(deficit>0?'-':'+')+Math.abs(Math.round(deficit));dEl.style.color=(deficit>=300&&deficit<=600)?'#4ECDC4':deficit>600?'#F9A825':'#EF5350';}
  var groupes={};
  repas.forEach(function(r,i){if(!groupes[r.sel])groupes[r.sel]=[];groupes[r.sel].push({r:r,i:i});});
  var order=['Petit-déjeuner','Déjeuner','Dîner','Encas'];
  var html='';
  order.forEach(function(g){
    if(!groupes[g])return;
    var gP=0,gK=0;
    groupes[g].forEach(function(x){gP+=x.r.p;gK+=x.r.k;});
    html+='<div class="repas-card"><div class="repas-header"><span class="repas-nom">'+g+'</span><span class="repas-total">'+Math.round(gP)+'g · '+Math.round(gK)+' kcal</span></div>';
    groupes[g].forEach(function(item){
      html+='<div class="aliment-row"><span class="aliment-nom">'+item.r.nom+'</span><span class="aliment-prot">'+item.r.p+'g</span><span class="aliment-kcal">'+item.r.k+' kc</span><button class="btn-del" onclick="removeFood('+item.i+')">×</button></div>';
    });
    html+='</div>';
  });
  if(!html)html='<div class="empty-state">Appuie sur + pour ajouter un aliment</div>';
  document.getElementById('content').innerHTML=html;
}

try{var s=localStorage.getItem('repas');if(s)repas=JSON.parse(s);}catch(e){}
try{var m=localStorage.getItem('mode');if(m)setMode(m);}catch(e){}
render();
</script>
