name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses > /dev/null || true
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'
    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
    - name: Build Debug APK
      run: gradle assembleDebug
    - name: Rename APK
      run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/CallisthenieApp-v8.9.apk
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CallisthenieApp-v8.9
        path: app/build/outputs/apk/debug/CallisthenieApp-v8.9.apk
        retention-days: 30
